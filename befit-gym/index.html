<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Befit Gym Salalah · Join online</title>
<meta name="description" content="Befit Gym Salalah. Modern machines, friendly trainers. Join online and get your digital membership card.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0E0D">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0E0D;--bg-2:#131615;--card:#181C1A;--ink:#F2F4EF;--ink-2:#AEB4AC;--muted:#7C827A;--line:#262B28;
 --lime:#C8F031;--lime-d:#A9D115;--err:#FF7B6B;
 --display:"Anton",Impact,sans-serif;--body:"Inter",system-ui,sans-serif}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit;color:inherit}svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.hl{color:var(--lime)}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] .disp{font-weight:800}
.ribbon{background:#000;color:#BFC5BC;font-size:12.5px;text-align:center;padding:8px 14px}.ribbon b{color:var(--lime)}
header{position:sticky;top:0;z-index:30;background:rgba(12,14,13,.82);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{height:74px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--lime);display:grid;place-items:center;transform:skewX(-8deg)}
.bn{font-family:var(--display);font-size:26px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.bn small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.28em;color:var(--muted);margin-top:4px;font-weight:600}
.links{display:flex;gap:26px;margin-inline-start:16px;font-size:14.5px;color:var(--ink-2);font-weight:500}.links a:hover{color:var(--ink)}
.sp{flex:1}
.chip{white-space:nowrap;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;background:var(--bg-2)}
.join-chip{background:var(--lime);border-color:var(--lime);color:#0C0E0D;font-weight:700}

.hero{position:relative;padding-top:40px}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.live{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:7px 14px 7px 10px;font-size:13.5px;font-weight:600}
html[dir="rtl"] .live{padding:7px 10px 7px 14px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(200,240,49,.18);animation:pulse 1.6s infinite}
.live.closed i{background:#FF7B6B;box-shadow:0 0 0 4px rgba(255,123,107,.18)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(200,240,49,0)}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,10vw,140px);line-height:.9;text-transform:uppercase;margin:18px 0 18px;letter-spacing:.005em}
html[dir="rtl"] h1{font-size:clamp(52px,8vw,104px);line-height:1.1}
.lead{font-size:18px;color:var(--ink-2);max-width:40ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{height:56px;padding:0 28px;border-radius:999px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--lime);color:#0C0E0D}.btn-p:hover{background:#D7FA54}
.btn-g{border:1px solid #3A403C;color:var(--ink)}
.art{position:relative;aspect-ratio:1/1;border-radius:32px;overflow:hidden;background:radial-gradient(70% 60% at 50% 45%,rgba(200,240,49,.22),transparent 70%),var(--bg-2);border:1px solid var(--line)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.floatc{position:absolute;z-index:2;background:rgba(19,22,21,.92);border:1px solid var(--line);border-radius:18px;padding:12px 16px;font-size:13px;color:var(--ink-2)}
.floatc b{display:block;color:var(--ink);font-size:16px}
.fA{top:22px;inset-inline-start:22px}.fB{bottom:22px;inset-inline-end:22px}
.ticker{margin-top:54px;background:var(--lime);color:#0C0E0D;overflow:hidden;white-space:nowrap;padding:13px 0;transform:rotate(-1.2deg);margin-inline:-20px}
.ticker div{display:inline-block;animation:tk 26s linear infinite}
html[dir="rtl"] .ticker div{animation-direction:reverse}
.ticker span{font-family:var(--display);font-size:24px;text-transform:uppercase;padding:0 22px;letter-spacing:.02em}
html[dir="rtl"] .ticker span{font-weight:800;font-size:20px}
@keyframes tk{to{transform:translateX(-33.33%)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:56px}
.stats div{background:var(--bg-2);padding:22px}
.stats b{font-family:var(--display);font-size:38px;font-weight:400;display:block;line-height:1}
html[dir="rtl"] .stats b{font-weight:800;font-size:32px}
.stats span{color:var(--muted);font-size:13.5px}

section.block{padding-top:96px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(46px,6vw,80px);line-height:.95;text-transform:uppercase;margin-top:10px}
html[dir="rtl"] h2{font-size:clamp(38px,5vw,60px);line-height:1.15}
.sub{color:var(--ink-2);max-width:44ch}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.plan{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.plan:hover{transform:translateY(-4px);border-color:#3A403C}
.plan.best{background:var(--lime);color:#0C0E0D;border-color:var(--lime)}
.plan .pt{font-weight:700;font-size:15px}
.plan .pp{font-family:var(--display);font-size:56px;line-height:1;margin-top:14px}
html[dir="rtl"] .plan .pp{font-weight:800;font-size:44px}
.plan .pp small{font-family:var(--body);font-size:14px;font-weight:600;opacity:.7}
.plan .per{font-size:13px;opacity:.7;margin-top:4px}
.plan ul{list-style:none;margin:18px 0 22px;display:grid;gap:8px;font-size:14.5px;flex:1}
.plan li::before{content:"✓";font-weight:800;color:var(--lime);margin-inline-end:8px}
.plan.best li::before{color:#0C0E0D}
.plan .go{height:48px;border-radius:999px;background:var(--ink);color:#0C0E0D;font-weight:700}
.plan.best .go{background:#0C0E0D;color:var(--lime)}
.save{position:absolute;top:-12px;inset-inline-end:18px;background:#0C0E0D;color:var(--lime);font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--lime)}
.note{color:var(--muted);font-size:13px;margin-top:14px}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.zone{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.zone .zi{height:150px;background:radial-gradient(60% 70% at 50% 60%,rgba(200,240,49,.16),transparent 70%),var(--bg-2)}
.zone .zi svg{width:100%;height:100%}
.zone div:last-child{padding:18px 20px 20px}.zone h4{font-size:18px}.zone p{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px}
.rev .st{color:var(--lime);letter-spacing:2px}
.rev q{font-size:19px;font-weight:600;line-height:1.35}
.rev small{color:var(--muted);margin-top:auto}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px}
.panel h3{font-family:var(--display);font-weight:400;font-size:40px;text-transform:uppercase;line-height:1}
html[dir="rtl"] .panel h3{font-weight:800;font-size:32px}
.panel p{color:var(--ink-2);margin-top:10px}
.hours{display:grid;gap:2px;margin-top:14px}
.hours div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.hours div span:first-child{color:var(--ink-2)}
.hours .today{color:var(--lime)}.hours .today span:first-child{color:var(--lime);font-weight:700}
footer{margin-top:96px;border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer b{color:var(--ink);font-family:var(--display);font-size:22px;font-weight:400;text-transform:uppercase}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-drawer .scrim{opacity:1;pointer-events:auto}
.notrans .drawer{transition:none!important}
.x{width:42px;height:42px;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:block}
html[dir="rtl"] .lbl{letter-spacing:0;font-size:14px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);background:var(--bg-2);border-inline-start:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}.show-drawer .drawer,html[dir="rtl"] .show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:400;font-size:34px;text-transform:uppercase}
html[dir="rtl"] .d-head h3{font-weight:800;font-size:28px}
.d-body{flex:1;overflow:auto;padding:4px 24px 24px}
.sec{margin-top:20px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.po{border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;background:var(--card)}
.po b{display:block;font-weight:700}.po span{font-size:13px;color:var(--muted)}
.po[aria-pressed="true"]{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.po[aria-pressed="true"] span{color:var(--lime)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.c{border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;background:var(--card)}
.c small{color:var(--muted);margin-inline-start:4px;font-weight:500}
.c[aria-pressed="true"]{background:var(--lime);color:#0C0E0D;border-color:var(--lime)}.c[aria-pressed="true"] small{color:#33400B}
.add{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:start;width:100%;background:var(--card);margin-bottom:8px}
.add .bx{width:22px;height:22px;border-radius:7px;border:2px solid #4A514C;display:grid;place-items:center;flex:none;font-size:13px;font-weight:900;color:#0C0E0D}
.add[aria-pressed="true"]{border-color:var(--lime)}.add[aria-pressed="true"] .bx{background:var(--lime);border-color:var(--lime)}.add[aria-pressed="true"] .bx::after{content:"✓"}
.add span{flex:1;font-weight:600;font-size:14.5px}.add span small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}.add em{font-style:normal;font-weight:700}
.in{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card)}.in:focus{outline:none;border-color:var(--lime)}
.in::placeholder{color:#5F665F}
.d-foot{border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:9px;background:#101312}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2)}.sum.total{font-size:19px;font-weight:800;color:var(--ink)}
.pay{height:58px;border-radius:999px;background:var(--lime);color:#0C0E0D;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.thw{background:#0C0E0D;color:#fff;border-radius:7px;padding:3px 8px;font-size:13px;font-weight:700}
.secure{font-size:12.5px;color:var(--muted);text-align:center}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#3A1E1A;color:#FFB4A8}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#0C0E0D;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;color:#111;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}
.ps-top{background:#0C0E0D;color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}.ps-top b{display:block;font-size:17px}.ps-top small{color:#AAA;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:#F1FAD3;color:#4C5E0C;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1px solid #E3E5E0;border-radius:14px;padding:13px;font-weight:600;font-size:14px;display:flex;justify-content:center;gap:8px}.ps-m[aria-pressed="true"]{border-color:#0C0E0D;background:#F4F6F1}
.ps-pay{height:56px;border-radius:999px;background:#0C0E0D;color:var(--lime);font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-pay .spin{border-color:rgba(200,240,49,.3);border-top-color:var(--lime)}
.ps-cancel{font-size:14px;color:#888;padding:4px}
.done{text-align:center;padding:18px 0 8px}
.done h4{font-family:var(--display);font-weight:400;font-size:42px;text-transform:uppercase;line-height:1}
html[dir="rtl"] .done h4{font-weight:800;font-size:32px}
.done p{color:var(--ink-2);margin-top:8px}
.mcard{margin:20px auto 0;max-width:380px;aspect-ratio:1.6/1;border-radius:22px;background:linear-gradient(135deg,#D6FB4A,#B4E01C);color:#0C0E0D;padding:20px;text-align:start;position:relative;overflow:hidden;animation:flip .8s cubic-bezier(.2,1.2,.3,1)}
@keyframes flip{0%{transform:perspective(800px) rotateY(80deg) scale(.9);opacity:0}}
.mcard::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:30px solid rgba(12,14,13,.07);inset-inline-end:-70px;top:-80px}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-top b{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:400;letter-spacing:.02em}
.mc-top span{font-size:11px;font-weight:800;background:#0C0E0D;color:var(--lime);padding:4px 9px;border-radius:999px;letter-spacing:.08em}
.mc-name{font-size:21px;font-weight:800;margin-top:18px;line-height:1.1}
.mc-plan{font-size:13px;font-weight:600;opacity:.75}
.mc-bot{position:absolute;left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.mc-bot small{display:block;font-size:10.5px;font-weight:700;opacity:.6;letter-spacing:.08em}
.mc-bot b{font-size:13.5px}
.bar{display:flex;gap:2px;height:34px;align-items:stretch}.bar i{background:#0C0E0D;display:block}
.again{margin-top:20px;width:100%}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){.links{display:none}.hgrid{grid-template-columns:1fr}.art{max-width:520px;width:100%;margin:0 auto}
 .plans,.zones{grid-template-columns:1fr 1fr}.reviews{grid-template-columns:1fr}.visit{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.wrap{padding-left:16px;padding-right:16px}.nav{gap:10px}.bn small{display:none}.chip{padding:0 14px}
 .hero{padding-top:22px}.lead{font-size:16px}.plans{grid-template-columns:1fr}.zones{gap:10px}.zone .zi{height:110px}.zone div:last-child{padding:14px}.zone p{font-size:13px}
 section.block{padding-top:72px}.ticker{margin-top:40px}.ticker span{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ribbon" data-t="ribbon" data-html></div>
<header id="hdr"><div class="wrap nav">
  <a href="#top" class="brand"><span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12" stroke="#0C0E0D" stroke-width="2.6" stroke-linecap="round"/></svg></span><span class="bn">Befit Gym<small data-t="tagline"></small></span></a>
  <nav class="links"><a href="#plans" data-t="navPlans"></a><a href="#inside" data-t="navInside"></a><a href="#visit" data-t="navVisit"></a></nav>
  <div class="sp"></div>
  <button class="chip" id="lang" type="button"></button>
  <button class="chip join-chip" id="joinTop" type="button" data-t="join"></button>
</div></header>

<main id="top">
  <section class="wrap hero">
    <div class="hgrid">
      <div class="reveal">
        <span class="live" id="live"><i></i><span id="liveT"></span></span>
        <h1 data-t="h1" data-html></h1>
        <p class="lead" data-t="lead"></p>
        <div class="cta"><a class="btn btn-p" href="#plans" data-t="cta1"></a><a class="btn btn-g" href="#inside" data-t="cta2"></a></div>
      </div>
      <div class="art reveal" id="art">
        <div class="floatc fA"><b>4.8 ★</b><span data-t="fA"></span></div>
        <div class="floatc fB"><b data-t="fB"></b><span data-t="fBs"></span></div>
      </div>
    </div>
    <div class="stats reveal"><div><b>6AM</b><span data-t="st1"></span></div><div><b>1AM</b><span data-t="st2"></span></div><div><b data-t="st3b"></b><span data-t="st3"></span></div><div><b data-t="st4b"></b><span data-t="st4"></span></div></div>
  </section>
  <div class="ticker" aria-hidden="true"><div id="tick"></div></div>

  <section class="wrap block" id="plans">
    <div class="head reveal"><div><div class="eyebrow" data-t="plEye"></div><h2 data-t="plH" data-html></h2></div><p class="sub" data-t="plSub"></p></div>
    <div class="plans" id="planGrid"></div>
    <p class="note" data-t="note"></p>
  </section>

  <section class="wrap block" id="inside">
    <div class="head reveal"><div><div class="eyebrow" data-t="inEye"></div><h2 data-t="inH" data-html></h2></div><p class="sub" data-t="inSub"></p></div>
    <div class="zones" id="zones"></div>
  </section>

  <section class="wrap block">
    <div class="head reveal"><div><div class="eyebrow" data-t="revEye"></div><h2 data-t="revH" data-html></h2></div></div>
    <div class="reviews"><figure class="rev reveal"><div class="st">★★★★★</div><q data-t="r1"></q><small data-t="rSrc"></small></figure><figure class="rev reveal"><div class="st">★★★★★</div><q data-t="r2"></q><small data-t="rSrc"></small></figure><figure class="rev reveal"><div class="st">★★★★★</div><q data-t="r3"></q><small data-t="rSrc"></small></figure></div>

    $("#done").innerHTML=`<div class="done"><h4>${t("doneH")}</h4><p>${t("doneP")}</p>
      <div class="mcard" dir="ltr"><div class="mc-top"><b>Befit Gym</b><span>${t("member")}</span></div><div class="mc-name">${esc($("#name").value.trim())}</div><div class="mc-plan">${P()[lang].t}${adds.length?" + "+adds.map(a=>ADDS.find(x=>x.id===a)[lang]).join(", "):""}</div>
      <div class="mc-bot"><div><small>${t("idL")}</small><b>${id}</b></div><div><small>${t("valid")}</small><b>${fmt(end)}</b></div><div class="bar">${bars}</div></div></div>
      <button type="button" class="btn btn-g again" id="again">${t("again")}</button></div>`;
    $("#done").hidden=false;
    $("#again").onclick=()=>{openDrawer(false);setTimeout(()=>{$("#done").hidden=true;$("#form").hidden=false;$("#dFoot").hidden=false;$("#psPay").textContent="";},350);window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(function init(){
  lang=st.get("bf_lang")||"en";
  $("#art").insertAdjacentHTML("afterbegin",heroSVG());
  applyLang();setInterval(()=>{const ls=liveStatus();$("#live").classList.toggle("closed",!ls.open);$("#liveT").textContent=ls.txt;},60000);
  document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
