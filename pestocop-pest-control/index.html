<style>

.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#FBE9E7;color:var(--err);font-weight:600}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(22,48,43,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}

.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:var(--blush);color:#7A4A3A;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800}

.ps-pay{height:56px;border-radius:999px;background:var(--em);color:#fff;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:var(--muted);padding:4px;font-weight:600}
.done{text-align:center;padding:22px 4px 8px}
.tick{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle,#F6EEDC,#DDF5E3);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--display);font-weight:500;font-size:32px}.done p{color:var(--ink-2);margin-top:8px}

.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted)}.rcpt span:last-child{text-align:end;font-weight:700}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){.links{display:none}.hero{grid-template-columns:1fr;padding-top:30px;gap:20px}.stage{max-width:400px;margin:0 auto;order:-1}

  .bA{left:0;top:6%}.bB{right:0;bottom:4%}.lead{font-size:16.5px}section.block{padding-top:70px}

  .tab{padding:0 14px 0 6px;height:48px}.tab .ic{width:34px;height:34px}.times{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>

/* state */
let lang="en",P=[],CATS=[],DEP=2000,sel=[],cat="insects",who=0,day=null,time=null,pay="deposit";
const $=s=>document.querySelector(s);
const st={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const t=k=>T[lang][k];
const omr=b=>lang==="ar"?(b/1000).toFixed(3)+" ر.ع":(b/1000).toFixed(3)+" OMR";
const esc=v=>String(v).replace(/[<&"]/g,c=>({"<":"&lt;","&":"&amp;",'"':"&quot;"}[c]));
const svc=id=>P.find(p=>p.id===id);
const fmtMin=m=>m>=60?`${Math.floor(m/60)}h${m%60?" "+(m%60)+t("mins"):""}`:`${m} ${t("mins")}`;
const tot=()=>{const s=sel.reduce((a,id)=>a+svc(id).price,0),m=sel.reduce((a,id)=>a+svc(id).min,0);return{s,m,now:sel.length?(pay==="deposit"?Math.min(DEP,s):s):0};};

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v!=="string")return;el.hasAttribute("data-html")?el.innerHTML=v:el.textContent=v;});
  $("#lang").textContent=t("lang");renderTabs();renderList();renderDrawer();
}
function renderTabs(){$("#tabs").innerHTML=CATS.map(c=>`<button type="button" class="tab" data-cat="${c.id}" aria-pressed="${c.id===cat}"><span class="ic">${IC[c.icon]}</span>${c[lang]}</button>`).join("");}
function renderList(){
  $("#list").innerHTML=P.filter(p=>p.cat===cat).map(p=>{const on=sel.includes(p.id);return `<div class="svc"><div class="nm"><b>${p[lang]}${p.pop?`<span class="pop">${lang==="ar"?"الأكثر طلباً":"Popular"}</span>`:""}</b><p>${lang==="ar"?p.dar:p.den}</p></div>
   <span class="dur">⏱ ${fmtMin(p.min)}</span><span class="pr">${omr(p.price)}</span><button type="button" class="addb" data-add="${p.id}" aria-pressed="${on}">${on?t("added"):t("add")}</button></div>`}).join("");
  const {s,m}=tot();$("#count").textContent=sel.length;$("#bar").classList.toggle("on",sel.length>0);
  $("#barT").textContent=`${t("svcN")(sel.length)} · ${omr(s)}`;$("#barS").textContent=`⏱ ${fmtMin(m)}`;
  st.set("pc_sel",sel);
}
function slots(){const out={morning:[],evening:[]};for(let h=9.5;h<=12.5;h+=.5)out.morning.push(h);for(let h=16;h<=21.5;h+=.5)out.evening.push(h);return out;}
const lab=h=>{const hh=Math.floor(h),mm=h%1?"30":"00",h12=hh>12?hh-12:hh;return lang==="ar"?`${h12}:${mm}${hh<12?"ص":"م"}`:`${h12}:${mm}`;};
function renderDrawer(){
  const {s,now}=tot();
  $("#lines").innerHTML=sel.length?sel.map(id=>{const p=svc(id);return `<div class="line"><div class="nm"><b>${p[lang]}</b><small>⏱ ${fmtMin(p.min)}</small></div><span class="pr">${omr(p.price)}</span><button class="rm" type="button" data-rm="${id}" aria-label="Remove">✕</button></div>`}).join("")
    :`<div style="text-align:center;padding:40px 0;color:var(--muted)"><b style="display:block;color:var(--ink)">${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden=!sel.length;
  $("#who").innerHTML=t("whoOpts").map((w,i)=>`<button type="button" class="c" data-who="${i}" aria-pressed="${i===who}">${w}</button>`).join("");
  const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d);}
  if(!day)day=days[0].toISOString().slice(0,10);
  $("#days").innerHTML=days.map((d,i)=>{const id=d.toISOString().slice(0,10);return `<button type="button" class="c" data-day="${id}" aria-pressed="${id===day}">${i===0?(lang==="ar"?"اليوم":"Today"):d.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{weekday:"short"})}<small>${d.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{day:"numeric",month:"short"})}</small></button>`}).join("");
  const sl=slots(),seed=parseInt(day.slice(-2));const taken=h=>((h*10+seed)%7)===0;
  $("#times").innerHTML=["morning","evening"].map(k=>`<div class="tlbl">${t(k)}</div><div class="times">${sl[k].map(h=>`<button type="button" class="c" data-time="${h}" aria-pressed="${h===time}" ${taken(h)?"disabled":""}>${lab(h)}</button>`).join("")}</div>`).join("");
  $("#payopt").innerHTML=[["deposit",t("depo"),t("depoS"),Math.min(DEP,s)],["full",t("full"),t("fullS"),s]].map(([id,a,b,v])=>`<button type="button" class="opt" data-pay="${id}" aria-pressed="${id===pay}"><i class="r"></i><span>${a}<small>${b}</small></span><em>${omr(v)}</em></button>`).join("");
  $("#sSvc").textContent=omr(s);$("#sTot").textContent=omr(now);
}
function openDrawer(v){if(v)renderDrawer();document.body.classList.toggle("show-drawer",v);$("#drawer").setAttribute("aria-hidden",String(!v));}
function err(k){const m=$("#msg");m.textContent=k?t(k):"";m.classList.toggle("on",!!k);}
let tt;function toast(s){const el=$("#toast");el.textContent=s;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1600);}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]");if(c){cat=c.dataset.cat;renderTabs();return renderList();}
  const a=e.target.closest("[data-add]");if(a){const id=a.dataset.add;sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];return renderList();}
  const r=e.target.closest("[data-rm]");if(r){sel=sel.filter(x=>x!==r.dataset.rm);renderList();return renderDrawer();}
  const w=e.target.closest("[data-who]");if(w){who=+w.dataset.who;return renderDrawer();}
  const d=e.target.closest("[data-day]");if(d){day=d.dataset.day;time=null;return renderDrawer();}
  const tm=e.target.closest("[data-time]");if(tm&&!tm.disabled){time=+tm.dataset.time;err("");return renderDrawer();}
  const p=e.target.closest("[data-pay]");if(p){pay=p.dataset.pay;return renderDrawer();}
  const m=e.target.closest("[data-m]");if(m)document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));
});
$("#barBtn").onclick=()=>openDrawer(true);$("#openCart").onclick=()=>openDrawer(true);$("#dClose").onclick=()=>openDrawer(false);$("#scrim").onclick=()=>openDrawer(false);
$("#lang").onclick=()=>{document.body.classList.add("notrans");setTimeout(()=>document.body.classList.remove("notrans"),60);lang=lang==="en"?"ar":"en";st.set("pc_lang",lang);applyLang();};
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("scrolled",scrollY>8),{passive:true});
$("#pay").onclick=()=>{err("");if(!sel.length)return err("errEmpty");if(time==null)return err("errSlot");
  const name=$("#name").value.trim(),phone=$("#phone").value.trim();if(!name||!/^\+?\d[\d\s]{6,16}$/.test(phone))return err("errForm");
  const {now}=tot();$("#psTot").textContent=omr(now);$("#psPay").textContent=`${t("psPayBtn")} ${omr(now)}`;$("#ps").classList.add("on");};
$("#psCancel").onclick=()=>$("#ps").classList.remove("on");
$("#psPay").onclick=()=>{$("#psPay").innerHTML='<span class="spin"></span>';
  setTimeout(()=>{$("#ps").classList.remove("on");const {now}=tot(),ref="PC-"+Math.floor(1000+Math.random()*9000);
    const dd=new Date(day).toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{weekday:"short",day:"numeric",month:"short"});
    $("#lines").innerHTML=`<div class="done"><div class="tick"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#1F4A41" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
     <div class="rcpt"><div><span>${t("rSvc")}</span><span>${sel.map(id=>svc(id)[lang]).join(", ")}</span></div><div><span>${t("rWhen")}</span><span>${dd} · ${lab(time)}</span></div><div><span>${t("rWho")}</span><span>${t("whoOpts")[who]}</span></div><div><span>${t("rPaid")}</span><span>${omr(now)}</span></div></div>
     <button type="button" class="btn btn-g" id="again" style="margin-top:20px;width:100%">${t("again")}</button></div>`;
    $("#checkout").hidden=true;$("#dFoot").hidden=true;sel=[];time=null;st.set("pc_sel",sel);$("#count").textContent=0;$("#bar").classList.remove("on");
    $("#again").onclick=()=>{openDrawer(false);$("#dFoot").hidden=false;renderList();window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(async function init(){
  lang=st.get("pc_lang")||"en";sel=st.get("pc_sel")||[];
  try{const c=await(await fetch("catalog.json")).json();P=c.products;CATS=c.categories;DEP=c.deposit;}catch(e){}
  $("#heroArt").innerHTML=hero;document.querySelectorAll("[data-ic]").forEach(el=>el.innerHTML=IC[el.dataset.ic]);
  applyLang();document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
</body>
</html>
