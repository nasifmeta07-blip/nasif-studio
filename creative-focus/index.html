<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Focus · Photoshoots in Salalah</title>
<meta name="description" content="Family, couple and Khareef photoshoots in Salalah. Book your session online before your trip.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111315">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111315;--bg-2:#181B1E;--card:#1D2125;--ink:#F3EEE6;--ink-2:#B9B3A9;--muted:#87827A;--line:#2B3035;
 --sun:#E8774A;--sun-d:#C95F35;--sand:#E9DCC7;--teal:#3A9C98;--err:#E4776A;
 --display:"Instrument Serif",Georgia,serif;--body:"Inter",system-ui,sans-serif}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit;color:inherit}svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.it{font-style:italic;color:var(--sun)}
html[dir="rtl"] .it{font-style:normal;font-weight:800}
.ribbon{background:#000;color:#CFC8BD;font-size:12.5px;text-align:center;padding:8px 14px}.ribbon b{color:var(--sun)}
header{position:sticky;top:0;z-index:30;background:rgba(17,19,21,.82);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{height:74px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.lens{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;position:relative}
.lens::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--sun)}
.bn{font-family:var(--display);font-size:26px;line-height:1}
.bn small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.28em;color:var(--muted);margin-top:4px;font-weight:600}
html[dir="rtl"] .bn small{letter-spacing:0}
.links{display:flex;gap:26px;margin-inline-start:16px;font-size:14.5px;color:var(--ink-2);font-weight:500}.links a:hover{color:var(--ink)}
.sp{flex:1}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;background:var(--bg-2)}
.book-chip{background:var(--sun);border-color:var(--sun);color:#111}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#111;color:var(--sun);font-size:12px;font-weight:700;display:grid;place-items:center}

.hero{position:relative;padding-top:40px}
.frame{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:16/8.4;min-height:420px}
.frame svg{position:absolute;inset:0;width:100%;height:100%}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,19,21,0) 35%,rgba(17,19,21,.85) 100%)}
.hcopy{position:absolute;left:44px;right:44px;bottom:40px;z-index:2}
.kicker{font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--sand)}
html[dir="rtl"] .kicker{letter-spacing:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,7vw,96px);line-height:.95;letter-spacing:-.01em;margin:12px 0 16px;max-width:14ch}
.lead{font-size:18px;color:#E0D9CE;max-width:42ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{height:54px;padding:0 26px;border-radius:999px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--sun);color:#111}.btn-p:hover{background:#F08A5E}
.btn-g{border:1px solid rgba(243,238,230,.5);color:var(--ink)}
.rec{position:absolute;top:22px;inset-inline-start:24px;z-index:2;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;color:#fff;background:rgba(0,0,0,.35);padding:7px 12px;border-radius:999px}
.rec i{width:8px;height:8px;border-radius:50%;background:#E54B3C;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.2}}
.meta{position:absolute;top:22px;inset-inline-end:24px;z-index:2;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.35);padding:7px 12px;border-radius:999px;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:22px}
.stats div{background:var(--bg-2);padding:20px 22px}
.stats b{font-family:var(--display);font-size:34px;font-weight:400;display:block;line-height:1}
.stats span{color:var(--muted);font-size:13.5px}

section.block{padding-top:96px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--sun)}
html[dir="rtl"] .eyebrow{letter-spacing:0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1;margin-top:10px}
.sub{color:var(--ink-2);max-width:44ch}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:240px 240px;gap:14px}
.ph{position:relative;border-radius:22px;overflow:hidden;background:var(--card)}
.ph svg{width:100%;height:100%}
.ph:first-child{grid-row:span 2}
.ph span{position:absolute;left:14px;bottom:12px;font-size:12px;font-weight:600;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px;letter-spacing:.04em}
html[dir="rtl"] .ph span{left:auto;right:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:#3E454C}
.card .art{height:210px;position:relative}.card .art svg{width:100%;height:100%}
.tag{position:absolute;top:14px;inset-inline-start:14px;background:var(--sun);color:#111;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05}
.desc{color:var(--ink-2);font-size:14.5px;margin-top:8px;flex:1}
.inc{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.inc span{font-size:12px;color:var(--sand);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.from{font-size:12.5px;color:var(--muted)}.from b{display:block;color:var(--ink);font-size:20px;font-weight:600}
.order{height:46px;padding:0 22px;border-radius:999px;background:var(--ink);color:#111;font-weight:700;font-size:14.5px}
.order:hover{background:var(--sun)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{border-top:1px solid var(--line);padding-top:22px}
.step .n{font-family:var(--display);font-style:italic;font-size:46px;color:var(--sun);line-height:1}
.step h4{font-size:18px;margin:10px 0 6px;font-weight:600}.step p{color:var(--ink-2);font-size:15px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:14px}
.rev .st{color:var(--sun);letter-spacing:2px}
.rev q{font-family:var(--display);font-size:27px;line-height:1.15}
html[dir="rtl"] .rev q{font-size:19px}
.rev small{color:var(--muted);margin-top:auto}
.contact{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:stretch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px}
.panel h3{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.panel p{color:var(--ink-2);margin-top:10px}
.spots{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.spots span{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--sand)}
footer{margin-top:96px;border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer b{color:var(--ink);font-family:var(--display);font-size:22px;font-weight:400}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-modal .scrim,.show-drawer .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(900px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:30px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
.show-modal .modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.notrans .drawer,.notrans .modal{transition:none!important}
.m-art{min-height:320px;position:relative}.m-art svg{position:absolute;inset:0;width:100%;height:100%}
.m-body{padding:30px 28px 26px;display:flex;flex-direction:column;gap:16px}
.m-body h3{font-family:var(--display);font-weight:400;font-size:38px;line-height:1}
.x{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;z-index:3}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:block}
html[dir="rtl"] .lbl{letter-spacing:0}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{flex:1 1 40%;border:1px solid var(--line);border-radius:16px;padding:11px 14px;text-align:start;background:var(--card)}
.pill b{display:block;font-weight:600}.pill span{font-size:13px;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.c{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;background:var(--card)}
.c small{color:var(--muted);margin-inline-start:4px}
.c[aria-pressed="true"]{background:var(--sun);color:#111;border-color:var(--sun)}.c[aria-pressed="true"] small{color:#3a2a20}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:46px;background:var(--card)}
.qty button{width:44px;height:100%;font-size:19px}.qty span{min-width:30px;text-align:center;font-weight:600}
.m-foot .btn{width:100%}
.in{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card)}.in:focus{outline:none;border-color:var(--sun)}
.in::placeholder{color:#6E6A64}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);background:var(--bg-2);border-inline-start:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}.show-drawer .drawer,html[dir="rtl"] .show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:400;font-size:32px}.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.thumb{width:66px;height:66px;border-radius:14px;overflow:hidden;flex:none}.thumb svg{width:100%;height:100%}
.info{flex:1;min-width:0}.info b{display:block;font-weight:600}.info small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:13px}
.sec{margin-top:20px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:start;background:var(--card)}
.slot b{display:block;font-weight:600;font-size:14.5px}.slot small{color:var(--muted);font-size:12.5px}
.slot[aria-pressed="true"]{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:start;width:100%;background:var(--card)}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #4A5057;display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"]{border-color:var(--sun)}.opt[aria-pressed="true"] .r{border-color:var(--sun)}.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun)}
.opt span{flex:1;font-weight:500;font-size:14.5px}.opt span small{display:block;color:var(--muted);font-size:12.5px}.opt em{font-style:normal;font-weight:600}
.payopt{display:grid;gap:10px}
.d-foot{border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:10px;background:#15181B}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2)}.sum.total{font-size:19px;font-weight:700;color:var(--ink)}
.pay{height:58px;border-radius:999px;background:var(--sun);color:#111;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.thw{background:#111;color:#fff;border-radius:7px;padding:3px 8px;font-size:13px;font-weight:700}
.secure{font-size:12.5px;color:var(--muted);text-align:center}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#3A1F1C;color:#F6B4AB}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#111;padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;z-index:70;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;color:#111;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}
.ps-top{background:#111;color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}.ps-top b{display:block;font-size:17px}.ps-top small{color:#AAA;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:#FCEBE3;color:#9A4524;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:700}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1px solid #E5E0D8;border-radius:14px;padding:13px;font-weight:600;font-size:14px;display:flex;justify-content:center;gap:8px}.ps-m[aria-pressed="true"]{border-color:var(--sun);background:#FCEBE3}
.ps-pay{height:56px;border-radius:999px;background:var(--sun);color:#111;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:#888;padding:4px}
.done{text-align:center;padding:22px 4px 8px}
.tick{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle,#3A2A22,#2A211C);border:1px solid var(--sun);display:grid;place-items:center;font-size:36px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--display);font-weight:400;font-size:38px}.done p{color:var(--ink-2);margin-top:8px}
.ref{display:inline-block;margin-top:14px;border:1px solid var(--sun);color:var(--sun);font-weight:600;padding:7px 14px;border-radius:999px;font-size:14px}
.rcpt{margin-top:20px;border:1px dashed #3E454C;border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted)}.rcpt span:last-child{text-align:end;font-weight:600}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){.links{display:none}.frame{aspect-ratio:auto;min-height:600px}.stats{grid-template-columns:1fr 1fr}
 .gallery{grid-template-columns:1fr 1fr;grid-template-rows:200px 160px 160px}.ph:first-child{grid-column:span 2;grid-row:auto}
 .grid,.reviews,.steps{grid-template-columns:1fr}.contact{grid-template-columns:1fr}.modal{grid-template-columns:minmax(0,1fr)}.m-art{min-height:200px}}
@media (max-width:620px){.wrap{padding-left:16px;padding-right:16px}.nav{gap:10px}.bn small{display:none}.book-chip [data-t=bookBtn]{display:none}.chip{padding:0 13px}
 .hero{padding-top:16px}.frame::after{background:linear-gradient(180deg,rgba(17,19,21,0) 20%,rgba(17,19,21,.55) 45%,rgba(17,19,21,.92) 100%)}.frame{min-height:560px;border-radius:24px}.hcopy{left:20px;right:20px;bottom:24px}.lead{font-size:16px}
 section.block{padding-top:72px}
 .modal{top:auto;bottom:0;left:0;width:100%;max-height:92%;border-radius:28px 28px 0 0;transform:translateY(100%)}.show-modal .modal{transform:none}.m-body{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ribbon" data-t="ribbon" data-html></div>
<header id="hdr"><div class="wrap nav">
  <a href="#top" class="brand"><span class="lens"></span><span class="bn">Creative Focus<small data-t="tagline"></small></span></a>
  <nav class="links"><a href="#work" data-t="navWork"></a><a href="#sessions" data-t="navSess"></a><a href="#how" data-t="navHow"></a><a href="#contact" data-t="navContact"></a></nav>
  <div class="sp"></div>
  <button class="chip" id="lang" type="button"></button>
  <button class="chip book-chip" id="openCart" type="button">📷 <span data-t="bookBtn"></span><span class="count" id="count">0</span></button>
</div></header>

<main id="top">
  <section class="wrap hero">
    <div class="frame reveal" id="heroFrame">
      <div class="rec"><i></i>REC</div><div class="meta">f/2.8 · 1/500 · ISO 100</div>
      <div class="hcopy">
        <div class="kicker" data-t="kicker"></div>
        <h1 data-t="h1" data-html></h1>
        <p class="lead" data-t="lead"></p>
        <div class="cta"><a class="btn btn-p" href="#sessions" data-t="cta1"></a><a class="btn btn-g" href="#work" data-t="cta2"></a></div>
      </div>
    </div>
    <div class="stats reveal"><div><b>5.0 ★</b><span data-t="st1"></span></div><div><b>48h</b><span data-t="st2"></span></div><div><b data-t="st3b"></b><span data-t="st3"></span></div><div><b>EN · AR</b><span data-t="st4"></span></div></div>
  </section>

  <section class="wrap block" id="work">
    <div class="head reveal"><div><div class="eyebrow" data-t="workEye"></div><h2 data-t="workH" data-html></h2></div><p class="sub" data-t="workSub"></p></div>
    <div class="gallery reveal" id="gallery"></div>
  </section>

  <section class="wrap block" id="sessions">
    <div class="head reveal"><div><div class="eyebrow" data-t="sessEye"></div><h2 data-t="sessH" data-html></h2></div><p class="sub" data-t="sessSub"></p></div>

  $("#gallery").innerHTML=["sunset","mountain","falls","beach","picnic"].map((k,i)=>`<div class="ph">${scene(k)}<span>${t("gal")[i]}</span></div>`).join("");
  $("#spots").innerHTML=t("spots").map(s=>`<span>📍 ${s}</span>`).join("");
  $("#grid").innerHTML=PRODUCTS.map(p=>{const L=p[lang],min=Math.min(...p.sizes.map(s=>s.price));return `<article class="card"><div class="art">${scene(p.scene)}<span class="tag">${p.tag[lang]}</span></div>
   <div class="body"><h3>${L.name}</h3><p class="desc">${L.desc}</p><div class="inc">${L.inc.map(x=>`<span>✓ ${x}</span>`).join("")}</div>
   <div class="row"><div class="from">${t("from")}<b>${omr(min)}</b></div><button class="order" type="button" data-open="${p.id}">${t("choose")}</button></div></div></article>`}).join("");
  buildDates();renderCart();if(cur)fillModal();
}
function openModal(id){cur=prod(id);curSize=cur.sizes[0].id;curLoc=id==="khareef"?"ayn":id==="couple"?"mughsail":"hotel";curPeople=id==="couple"?2:4;curAdds=[];fillModal();document.body.classList.add("show-modal");}
function closeModal(){document.body.classList.remove("show-modal");cur=null;}
function fillModal(){const L=cur[lang];
  $("#mArt").innerHTML=scene(cur.scene);$("#mTag").textContent=cur.tag[lang];$("#mName").textContent=L.name;$("#mDesc").textContent=L.desc;
  $("#mSizes").innerHTML=cur.sizes.map(s=>`<button type="button" class="pill" data-size="${s.id}" aria-pressed="${s.id===curSize}"><b>${t("sizes")[s.id]}</b><span>${t("sizeSub")[s.id]} · ${omr(s.price)}</span></button>`).join("");
  $("#mLoc").innerHTML=LOCS.map(l=>`<button type="button" class="c" data-loc="${l.id}" aria-pressed="${l.id===curLoc}">📍 ${l[lang]}</button>`).join("");
  $("#mAdds").innerHTML=ADDS.map(a=>`<button type="button" class="c" data-add="${a.id}" aria-pressed="${curAdds.includes(a.id)}">${a.icon} ${a[lang]}<small>+${a.price/1000}</small></button>`).join("");
  $("#pQty").textContent=curPeople;
  $("#mAdd").textContent=`${t("add")} · ${omr(price({id:cur.id,size:curSize,adds:curAdds}))}`;}
function addToCart(){cart.push({id:cur.id,size:curSize,loc:curLoc,people:curPeople,adds:[...curAdds]});closeModal();renderCart();openDrawer(true);}
function buildDates(){const s=$("#date"),k=s.value;s.innerHTML="";for(let i=2;i<=30;i++){const d=new Date();d.setDate(d.getDate()+i);s.add(new Option(d.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{weekday:"short",day:"numeric",month:"short"}),d.toISOString().slice(0,10)));}if(k)s.value=k;}
function renderCart(){
  const {s,now}=totals();$("#count").textContent=cart.length;
  $("#lines").innerHTML=cart.length?cart.map((c,i)=>{const p=prod(c.id),loc=LOCS.find(l=>l.id===c.loc);return `<div class="line"><span class="thumb">${scene(p.scene)}</span><div class="info"><b>${p[lang].name}</b><small>${t("sizes")[c.size]} · 📍 ${loc[lang]} · 👥 ${c.people}</small>${c.adds.length?`<small>+ ${c.adds.map(a=>ADDS.find(x=>x.id===a)[lang]).join(", ")}</small>`:""}<small>${omr(price(c))}</small></div><button class="rm" type="button" data-rm="${i}">✕</button></div>`}).join("")
   :`<div style="text-align:center;padding:40px 0;color:var(--muted)"><b style="display:block;color:var(--ink)">${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden=!cart.length;
  $("#slots").innerHTML=SLOTS.map(x=>`<button type="button" class="slot" data-slot="${x.id}" aria-pressed="${x.id===slot}"><b>${x[lang]} · ${x.t}</b><small>${x.s[lang]}</small></button>`).join("");
  $("#payopt").innerHTML=[["deposit",t("depo"),t("depoS"),Math.min(DEP*Math.max(cart.length,1),s)],["full",t("full"),t("fullS"),s]].map(([id,a,b,v])=>`<button type="button" class="opt" data-pay="${id}" aria-pressed="${id===pay}"><i class="r"></i><span>${a}<small>${b}</small></span><em>${omr(v)}</em></button>`).join("");
  $("#sTot").textContent=omr(s);$("#sNow").textContent=omr(now);
}
function openDrawer(v){document.body.classList.toggle("show-drawer",v);$("#drawer").setAttribute("aria-hidden",String(!v));}
function err(k){const m=$("#msg");m.textContent=k?t(k):"";m.classList.toggle("on",!!k);}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o)return openModal(o.dataset.open);
  const s=e.target.closest("[data-size]");if(s&&cur){curSize=s.dataset.size;return fillModal();}
  const l=e.target.closest("[data-loc]");if(l&&cur){curLoc=l.dataset.loc;return fillModal();}
  const a=e.target.closest("[data-add]");if(a&&cur){const id=a.dataset.add;curAdds=curAdds.includes(id)?curAdds.filter(x=>x!==id):[...curAdds,id];return fillModal();}
  const r=e.target.closest("[data-rm]");if(r){cart.splice(+r.dataset.rm,1);return renderCart();}
  const sl=e.target.closest("[data-slot]");if(sl){slot=sl.dataset.slot;err("");return renderCart();}
  const p=e.target.closest("[data-pay]");if(p){pay=p.dataset.pay;return renderCart();}
  const m=e.target.closest("[data-m]");if(m)document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));
});
$("#pInc").onclick=()=>{curPeople=Math.min(curPeople+1,20);fillModal();};$("#pDec").onclick=()=>{curPeople=Math.max(curPeople-1,1);fillModal();};
$("#mAdd").onclick=addToCart;$("#mClose").onclick=closeModal;
$("#openCart").onclick=()=>openDrawer(true);$("#dClose").onclick=()=>openDrawer(false);$("#scrim").onclick=()=>{closeModal();openDrawer(false);};
$("#lang").onclick=()=>{document.body.classList.add("notrans");setTimeout(()=>document.body.classList.remove("notrans"),60);lang=lang==="en"?"ar":"en";st.set("cf_lang",lang);applyLang();};
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("scrolled",scrollY>8),{passive:true});
$("#pay").onclick=()=>{err("");if(!cart.length)return err("errEmpty");if(!slot)return err("errSlot");
  const name=$("#name").value.trim(),phone=$("#phone").value.trim();if(!name||!/^\+?\d[\d\s]{6,16}$/.test(phone))return err("errForm");
  const {now}=totals();$("#psTot").textContent=omr(now);$("#psPay").textContent=`${t("psPayBtn")} ${omr(now)}`;$("#ps").classList.add("on");};
$("#psCancel").onclick=()=>$("#ps").classList.remove("on");
$("#psPay").onclick=()=>{$("#psPay").innerHTML='<span class="spin"></span>';
  setTimeout(()=>{$("#ps").classList.remove("on");const {now}=totals(),ref="CF-"+Math.floor(1000+Math.random()*9000),c=cart[0],sl=SLOTS.find(x=>x.id===slot);
    $("#lines").innerHTML=`<div class="done"><div class="tick">📸</div><h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
     <div class="rcpt"><div><span>${t("rSess")}</span><span>${prod(c.id)[lang].name}</span></div><div><span>${t("rWhen")}</span><span>${esc($("#date").selectedOptions[0].text)} · ${sl[lang]}</span></div><div><span>${t("rWhere")}</span><span>${esc($("#hotel").value.trim()||LOCS.find(l=>l.id===c.loc)[lang])}</span></div><div><span>${t("rPaid")}</span><span>${omr(now)}</span></div></div>
     <button type="button" class="btn btn-g" id="again" style="margin-top:20px;width:100%">${t("again")}</button></div>`;
    $("#checkout").hidden=true;$("#dFoot").hidden=true;cart=[];slot=null;$("#count").textContent=0;
    $("#again").onclick=()=>{openDrawer(false);$("#dFoot").hidden=false;renderCart();window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(function init(){
  lang=st.get("cf_lang")||((navigator.language||"").startsWith("ar")?"ar":"en");
  $("#heroFrame").insertAdjacentHTML("afterbegin",scene("sunset"));
  applyLang();document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
</body>
</html>
