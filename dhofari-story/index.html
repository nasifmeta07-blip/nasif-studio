<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصة ظفارية · Dhofari Story · عبايات صلالة</title>
<meta name="description" content="Elegant abayas from Salalah. Order online with delivery across Oman.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5EFE6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFE6;--bg-2:#EDE4D7;--card:#FFFDF9;--ink:#1C1714;--ink-2:#5E554D;--muted:#93897E;--line:#E2D7C8;
 --gold:#A9824F;--gold-d:#8A6639;--rose:#C48A7C;--night:#1C1714;--err:#B44B3E;
 --display:"Playfair Display",Georgia,serif;--body:"DM Sans",system-ui,sans-serif}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select,textarea{font:inherit;color:inherit}svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.it{font-style:italic;color:var(--gold)}html[dir="rtl"] .it{font-style:normal;font-weight:800}
.ribbon{background:var(--night);color:#D9CDBD;font-size:12.5px;text-align:center;padding:8px 14px}.ribbon b{color:#E3C08F}
header{position:sticky;top:0;z-index:30;background:rgba(245,239,230,.86);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{height:76px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:50%;background:var(--night);display:grid;place-items:center}
.bn{font-family:var(--display);font-size:22px;line-height:1.05;font-weight:700}
html:not([dir="rtl"]) .bn{font-weight:500}
.bn small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.26em;color:var(--muted);margin-top:3px;font-weight:600}
html[dir="rtl"] .bn small{letter-spacing:0;font-size:11.5px}
.links{display:flex;gap:26px;margin-inline-start:16px;font-size:15px;color:var(--ink-2);font-weight:500}.links a:hover{color:var(--ink)}
.sp{flex:1}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;background:var(--card)}
.bag-chip{background:var(--night);color:#fff;border-color:var(--night)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#E3C08F;color:var(--night);font-size:12px;font-weight:700;display:grid;place-items:center}

.hero{padding-top:34px;display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
html[dir="rtl"] .kicker{letter-spacing:0;font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,6.4vw,88px);line-height:1;letter-spacing:-.01em;margin:14px 0 18px}
html[dir="rtl"] h1{font-weight:800;line-height:1.15;letter-spacing:0}
.lead{font-size:18px;color:var(--ink-2);max-width:40ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{height:54px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--night);color:#fff}.btn-p:hover{background:#3A302A}
.btn-g{border:1px solid var(--ink);color:var(--ink)}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;color:var(--ink-2);font-size:14.5px;font-weight:500}
.trust b{color:var(--ink)}
.stage{position:relative;aspect-ratio:4/4.6;border-radius:220px 220px 28px 28px;overflow:hidden;background:linear-gradient(180deg,#E9DCC9,#DCC8AF)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 14px 34px -18px rgba(60,40,20,.5);font-size:13.5px}
.badge b{display:block;font-size:15.5px}
.bA{bottom:26px;inset-inline-start:-14px}.bB{top:40px;inset-inline-end:-10px}
.strip{margin-top:56px;background:var(--night);color:#EADFCF;overflow:hidden;white-space:nowrap;padding:14px 0;font-weight:600;font-size:15px}
.strip span{display:inline-block;padding:0 26px}.strip i{color:#E3C08F;font-style:normal}

section.block{padding-top:96px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(38px,4.8vw,60px);line-height:1.05;margin-top:8px}
html[dir="rtl"] h2{font-weight:800}
.sub{color:var(--ink-2);max-width:44ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.tab[aria-pressed="true"]{background:var(--night);color:#fff;border-color:var(--night)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(60,40,20,.45)}
.card .art{aspect-ratio:3/3.6;position:relative;background:linear-gradient(180deg,#F1E7DA,#E6D6C1)}.card .art svg{width:100%;height:100%}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--night);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.tag.new{background:#E3C08F;color:var(--night)}
.sw{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;gap:5px}
.sw i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.2}
html[dir="rtl"] .body h3{font-weight:700;font-size:19px}
.desc{color:var(--ink-2);font-size:13.5px;margin-top:4px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.price{font-weight:700;font-size:17px}
.order{height:42px;padding:0 18px;border-radius:999px;background:var(--night);color:#fff;font-weight:700;font-size:14px}
.order:hover{background:var(--gold-d)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.f{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px}
.f .ic{width:50px;height:50px;border-radius:16px;background:var(--bg-2);display:grid;place-items:center;font-size:22px}
.f h4{font-size:18px;margin:14px 0 6px}.f p{color:var(--ink-2);font-size:15px}
.measure{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:center;background:var(--night);color:#F2E9DC;border-radius:32px;padding:40px;overflow:hidden}
.measure h2{color:#fff}.measure .sub{color:#CDBFAE}
.mt{width:100%;border-collapse:collapse;font-size:15px}
.mt th,.mt td{padding:12px 10px;border-bottom:1px solid #3A322C;text-align:start}
.mt th{color:#E3C08F;font-weight:600;font-size:13px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px}
.rev .st{color:var(--gold);letter-spacing:2px}
.rev q{font-family:var(--display);font-size:22px;line-height:1.3}
html[dir="rtl"] .rev q{font-size:18px;font-weight:500}
.rev small{color:var(--muted);margin-top:auto}
.visit{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px}
.panel h3{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.1}
html[dir="rtl"] .panel h3{font-weight:800}
.panel p{color:var(--ink-2);margin-top:10px}
footer{margin-top:96px;border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer b{color:var(--ink);font-family:var(--display);font-size:20px}

.scrim{position:fixed;inset:0;background:rgba(28,23,20,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-modal .scrim,.show-drawer .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(900px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--card);border-radius:30px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
.show-modal .modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.notrans .drawer,.notrans .modal{transition:none!important}
.m-art{min-height:340px;position:relative;background:linear-gradient(180deg,#F1E7DA,#E2CFB6)}.m-art svg{position:absolute;inset:0;width:100%;height:100%}
.m-body{padding:28px 26px 24px;display:flex;flex-direction:column;gap:16px}
.m-body h3{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.1}
html[dir="rtl"] .m-body h3{font-weight:800}
.x{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,253,249,.9);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;z-index:3}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:block}
html[dir="rtl"] .lbl{letter-spacing:0;font-size:14px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sz{width:54px;height:46px;border:1px solid var(--line);border-radius:14px;font-weight:600;background:var(--card)}
.sz[aria-pressed="true"]{background:var(--night);color:#fff;border-color:var(--night)}
.cols{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:500;font-size:14px}
html[dir="rtl"] .col{padding:6px 6px 6px 14px}
.col i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.col[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.c{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;background:var(--card)}
.c small{color:var(--muted);margin-inline-start:4px}
.c[aria-pressed="true"]{background:var(--bg-2);border-color:var(--gold);color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:46px}
.qty button{width:44px;height:100%;font-size:19px}.qty span{min-width:30px;text-align:center;font-weight:700}
.in{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}.in:focus{outline:none;border-color:var(--gold)}
.in::placeholder{color:#B3A99D}
.m-foot{display:flex;gap:12px;align-items:center}.m-foot .btn{flex:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}.show-drawer .drawer,html[dir="rtl"] .show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:500;font-size:28px}
html[dir="rtl"] .d-head h3{font-weight:800}.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.thumb{width:64px;height:76px;border-radius:14px;overflow:hidden;flex:none;background:#EADFCF}.thumb svg{width:100%;height:100%}
.info{flex:1;min-width:0}.info b{display:block;font-weight:700}.info small{display:block;color:var(--muted);font-size:13px}
.rm{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:13px}
.sec{margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:start;width:100%;background:var(--card);margin-bottom:8px}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #C8BBAA;display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"]{border-color:var(--ink)}.opt[aria-pressed="true"] .r{border-color:var(--ink)}.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt span{flex:1;font-weight:600;font-size:14.5px}.opt span small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}.opt em{font-style:normal;font-weight:700}
.d-foot{border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:9px;background:var(--card)}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2)}.sum.total{font-size:19px;font-weight:800;color:var(--ink)}
.pay{height:58px;border-radius:999px;background:var(--night);color:#fff;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.thw{background:#E3C08F;color:var(--night);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:800}
.secure{font-size:12.5px;color:var(--muted);text-align:center}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#F7E1DC;color:var(--err)}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--night);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;z-index:70;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(28,23,20,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}
.ps-top{background:var(--night);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}.ps-top b{display:block;font-size:17px}.ps-top small{color:#BBB;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:#F6EBDB;color:#7A5A2E;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;font-size:14px;display:flex;justify-content:center;gap:8px}.ps-m[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.ps-pay{height:56px;border-radius:999px;background:var(--night);color:#fff;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:#888;padding:4px}
.done{text-align:center;padding:22px 4px 8px}
.tick{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;background:var(--night);display:grid;place-items:center;font-size:36px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--display);font-weight:500;font-size:32px}
html[dir="rtl"] .done h4{font-weight:800}
.done p{color:var(--ink-2);margin-top:8px}
.ref{display:inline-block;margin-top:14px;background:var(--bg-2);font-weight:700;padding:7px 14px;border-radius:999px;font-size:14px}
.rcpt{margin-top:20px;border:1px dashed #CDBFAD;border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px;background:var(--card)}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted)}.rcpt span:last-child{text-align:end;font-weight:700}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){.links{display:none}.hero{grid-template-columns:1fr}.stage{max-width:460px;width:100%;margin:0 auto}
 .grid{grid-template-columns:1fr 1fr}.feat,.reviews{grid-template-columns:1fr}.measure{grid-template-columns:1fr;padding:28px}.visit{grid-template-columns:1fr}
 .modal{grid-template-columns:minmax(0,1fr)}.m-art{min-height:260px}}
@media (max-width:620px){.wrap{padding-left:16px;padding-right:16px}.nav{gap:10px}.bn small{display:none}.bag-chip [data-t=bag]{display:none}.chip{padding:0 13px}
 .hero{padding-top:20px;gap:26px}.lead{font-size:16px}.grid{gap:12px}.body{padding:12px 12px 14px}.body h3{font-size:17px}html[dir="rtl"] .body h3{font-size:16px}.desc{display:none}
 .row{flex-direction:column;align-items:stretch;gap:8px}.order{height:40px}
 section.block{padding-top:72px}.bA{inset-inline-start:8px}.bB{inset-inline-end:8px}
 .modal{top:auto;bottom:0;left:0;width:100%;max-height:92%;border-radius:28px 28px 0 0;transform:translateY(100%)}.show-modal .modal{transform:none}.m-body{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ribbon" data-t="ribbon" data-html></div>
<header id="hdr"><div class="wrap nav">
  <a href="#top" class="brand"><span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3c-2 0-3 1.4-3 3.2 0 1 .5 1.8 1 2.3L6 21h12L14 8.5c.5-.5 1-1.3 1-2.3C15 4.4 14 3 12 3Z" fill="#E3C08F"/></svg></span><span class="bn" data-t="brand" data-html></span></a>
  <nav class="links"><a href="#shop" data-t="navShop"></a><a href="#sizes" data-t="navSize"></a><a href="#visit" data-t="navVisit"></a></nav>
  <div class="sp"></div>
  <button class="chip" id="lang" type="button"></button>
  <button class="chip bag-chip" id="openCart" type="button">🛍️ <span data-t="bag"></span><span class="count" id="count">0</span></button>
</div></header>

<main id="top">
  <section class="wrap hero">
    <div class="reveal">
      <div class="kicker" data-t="kicker"></div>
      <h1 data-t="h1" data-html></h1>
      <p class="lead" data-t="lead"></p>
      <div class="cta"><a class="btn btn-p" href="#shop" data-t="cta1"></a><a class="btn btn-g" href="#sizes" data-t="cta2"></a></div>
      <div class="trust"><span><b>5.0 ★</b> <span data-t="tr1"></span></span><span>🚚 <span data-t="tr2"></span></span><span>📏 <span data-t="tr3"></span></span></div>
    </div>
    <div class="stage reveal" id="stage">
      <div class="badge bA"><b data-t="bA"></b><span data-t="bAs"></span></div>
      <div class="badge bB"><b data-t="bB"></b><span data-t="bBs"></span></div>
    </div>

function renderGrid(){
  $("#tabs").innerHTML=Object.entries(t("tabs")).map(([k,v])=>`<button type="button" class="tab" data-tab="${k}" aria-pressed="${k===filt}">${v}</button>`).join("");
  $("#grid").innerHTML=PRODUCTS.filter(p=>filt==="all"||p.cat===filt||(filt==="new"&&p.isNew)).map(p=>`<article class="card"><div class="art">${abaya(p,p.cols[0])}<span class="tag${p.isNew?" new":""}">${p.tag[lang]}</span><div class="sw">${p.cols.map(c=>`<i style="background:${COLS[c].hex}"></i>`).join("")}</div></div>
   <div class="body"><h3>${p[lang].name}</h3><p class="desc">${p[lang].desc}</p><div class="row"><span class="price">${omr(p.price)}</span><button class="order" type="button" data-open="${p.id}">${t("choose")}</button></div></div></article>`).join("");
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v!=="string")return;el.hasAttribute("data-html")?el.innerHTML=v:el.textContent=v;});
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $("#lang").textContent=t("lang");
  $("#marq").innerHTML=[...t("marq"),...t("marq"),...t("marq")].map(x=>`<span><i>✦</i> ${x}</span>`).join("");
  $("#mt").innerHTML=SIZES.map((s,k)=>`<tr><td><b>${s}</b></td><td>${s}″</td><td>${[150,155,160,165,170][k]}–${[155,160,165,170,178][k]} cm</td></tr>`).join("");
  renderGrid();renderCart();if(cur)fillModal();
}
function openModal(id){cur=prod(id);curCol=cur.cols[0];curSize=56;curAdds=[];curQty=1;fillModal();document.body.classList.add("show-modal");}
function closeModal(){document.body.classList.remove("show-modal");cur=null;}
function fillModal(){const L=cur[lang];
  $("#mArt").innerHTML=abaya(cur,curCol,1);$("#mTag").textContent=cur.tag[lang];$("#mName").textContent=L.name;$("#mDesc").textContent=L.desc;
  $("#mCols").innerHTML=cur.cols.map(c=>`<button type="button" class="col" data-col="${c}" aria-pressed="${c===curCol}"><i style="background:${COLS[c].hex}"></i>${COLS[c][lang]}</button>`).join("");
  $("#mSizes").innerHTML=SIZES.map(s=>`<button type="button" class="sz" data-sz="${s}" aria-pressed="${s===curSize}">${s}</button>`).join("");
  $("#mAdds").innerHTML=ADDS.map(a=>`<button type="button" class="c" data-add="${a.id}" aria-pressed="${curAdds.includes(a.id)}">${a.icon} ${a[lang]}<small>+${a.price/1000}</small></button>`).join("");
  $("#qN").textContent=curQty;
  $("#mAdd").textContent=`${t("add")} · ${omr(unit({id:cur.id,adds:curAdds})*curQty)}`;}
function addToCart(){cart.push({id:cur.id,col:curCol,size:curSize,adds:[...curAdds],qty:curQty});closeModal();renderCart();setTimeout(()=>openDrawer(true),350);}
function renderCart(){
  const {s,d,tot}=totals();$("#count").textContent=cart.reduce((a,c)=>a+c.qty,0);
  $("#lines").innerHTML=cart.length?cart.map((c,i)=>{const p=prod(c.id);return `<div class="line"><span class="thumb">${abaya(p,c.col)}</span><div class="info"><b>${p[lang].name}</b><small>${COLS[c.col][lang]} · ${t("size")} ${c.size} · ×${c.qty}</small>${c.adds.length?`<small>+ ${c.adds.map(a=>ADDS.find(x=>x.id===a)[lang]).join("، ")}</small>`:""}<small style="color:var(--ink);font-weight:700">${omr(unit(c)*c.qty)}</small></div><button class="rm" type="button" data-rm="${i}">✕</button></div>`}).join("")
   :`<div style="text-align:center;padding:40px 0;color:var(--muted)"><b style="display:block;color:var(--ink)">${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden=!cart.length;$("#addrWrap").hidden=deliv==="pickup";
  $("#dopt").innerHTML=DELIV.map(x=>`<button type="button" class="opt" data-del="${x.id}" aria-pressed="${x.id===deliv}"><i class="r"></i><span>${x[lang]}<small>${x.s[lang]}</small></span><em>${x.fee?omr(x.fee):t("free")}</em></button>`).join("");
  $("#sSub").textContent=omr(s);$("#sDel").textContent=d?omr(d):t("free");$("#sTot").textContent=omr(tot);
}
function openDrawer(v){document.body.classList.toggle("show-drawer",v);$("#drawer").setAttribute("aria-hidden",String(!v));}
function err(k){const m=$("#msg");m.textContent=k?t(k):"";m.classList.toggle("on",!!k);}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o)return openModal(o.dataset.open);
  const tb=e.target.closest("[data-tab]");if(tb){filt=tb.dataset.tab;return renderGrid();}
  const cl=e.target.closest("[data-col]");if(cl&&cur){curCol=cl.dataset.col;return fillModal();}
  const sz=e.target.closest("[data-sz]");if(sz&&cur){curSize=+sz.dataset.sz;return fillModal();}
  const a=e.target.closest("[data-add]");if(a&&cur){const id=a.dataset.add;curAdds=curAdds.includes(id)?curAdds.filter(x=>x!==id):[...curAdds,id];return fillModal();}
  const r=e.target.closest("[data-rm]");if(r){cart.splice(+r.dataset.rm,1);return renderCart();}
  const dl=e.target.closest("[data-del]");if(dl){deliv=dl.dataset.del;err("");return renderCart();}
  const m=e.target.closest("[data-m]");if(m)document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));
});
$("#qInc").onclick=()=>{curQty=Math.min(curQty+1,9);fillModal();};$("#qDec").onclick=()=>{curQty=Math.max(curQty-1,1);fillModal();};
$("#mAdd").onclick=addToCart;$("#mClose").onclick=closeModal;
$("#openCart").onclick=()=>openDrawer(true);$("#dClose").onclick=()=>openDrawer(false);$("#scrim").onclick=()=>{closeModal();openDrawer(false);};
$("#lang").onclick=()=>{document.body.classList.add("notrans");setTimeout(()=>document.body.classList.remove("notrans"),60);lang=lang==="en"?"ar":"en";st.set("ds_lang",lang);applyLang();};
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("scrolled",scrollY>8),{passive:true});
$("#pay").onclick=()=>{err("");if(!cart.length)return err("errEmpty");
  const name=$("#name").value.trim(),phone=$("#phone").value.replace(/\s/g,"");
  if(deliv!=="pickup"&&!$("#addr").value.trim())return err("errAddr");
  if(!name||!/^(\+?968)?[279]\d{7}$/.test(phone))return err("errForm");
  const {tot}=totals();$("#psTot").textContent=omr(tot);$("#psPay").textContent=`${t("psPayBtn")} ${omr(tot)}`;$("#ps").classList.add("on");};
$("#psCancel").onclick=()=>$("#ps").classList.remove("on");
$("#psPay").onclick=()=>{$("#psPay").innerHTML='<span class="spin"></span>';
  setTimeout(()=>{$("#ps").classList.remove("on");const {tot}=totals(),ref="DS-"+Math.floor(1000+Math.random()*9000),n=cart.reduce((a,c)=>a+c.qty,0),dv=DELIV.find(x=>x.id===deliv);
    $("#lines").innerHTML=`<div class="done"><div class="tick">🤍</div><h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
     <div class="rcpt"><div><span>${t("rItems")}</span><span>${cart.map(c=>esc(prod(c.id)[lang].name)).join("، ")} (${n})</span></div><div><span>${t("rDel")}</span><span>${dv[lang]}</span></div><div><span>${t("rPaid")}</span><span>${omr(tot)}</span></div></div>
     <button type="button" class="btn btn-g" id="again" style="margin-top:20px;width:100%">${t("again")}</button></div>`;
    $("#checkout").hidden=true;$("#dFoot").hidden=true;cart=[];$("#count").textContent=0;
    $("#again").onclick=()=>{openDrawer(false);$("#dFoot").hidden=false;renderCart();window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(function init(){
  lang=st.get("ds_lang")||"ar";
  $("#stage").insertAdjacentHTML("afterbegin",abaya(PRODUCTS[0],"black",1));
  applyLang();document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
</body>
</html>
