<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Tails Salalah · Pet grooming & boarding</title>
<meta name="description" content="Happy Tails Salalah: book pet grooming and boarding online, with daily updates while you travel.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2D2A4A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Nunito:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F1;--bg-2:#FDE9DA;--card:#FFFFFF;--ink:#2D2A4A;--ink-2:#5E5A78;--muted:#9A96B0;--line:#F2E2D4;
 --oud:#2D2A4A;--amber:#FF8A5B;--amber-d:#E2683A;--hojari:#7C9C84;--err:#B44B3E;
 --display:"Fraunces",Georgia,serif;--body:"Nunito",system-ui,sans-serif}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit;color:inherit}svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.am{color:var(--amber);font-style:italic}html[dir="rtl"] .am{font-style:normal}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{font-weight:800}
.ribbon{background:#000;color:#D8CAB4;font-size:12.5px;text-align:center;padding:8px 14px}.ribbon b{color:#FFC85C}
header{position:absolute;top:auto;left:0;right:0;z-index:30}
.hdr{position:sticky;top:0;z-index:30;background:rgba(45,42,74,.94);backdrop-filter:blur(14px);color:#F4ECDD;border-bottom:1px solid rgba(255,255,255,.06)}
.nav{height:74px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:50%;border:1.5px solid #FFC85C;display:grid;place-items:center}
.bn{font-family:var(--display);font-size:24px;line-height:1;font-weight:600}
.bn small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.26em;color:#B9A88F;margin-top:4px;font-weight:500}
html[dir="rtl"] .bn{font-weight:800;font-size:22px}html[dir="rtl"] .bn small{letter-spacing:0;font-size:11.5px}
.links{display:flex;gap:26px;margin-inline-start:16px;font-size:15px;color:#CFC0A8}.links a:hover{color:#fff}
.sp{flex:1}
.chip{white-space:nowrap;height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.bag-chip{background:#FFC85C;border-color:#FFC85C;color:var(--oud)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--oud);color:#FFC85C;font-size:12px;font-weight:700;display:grid;place-items:center}

.hero{background:radial-gradient(70% 80% at 70% 40%,#3E3A66 0%,#2D2A4A 62%);color:#F4ECDD;overflow:hidden;position:relative}
html[dir="rtl"] .hero{background:radial-gradient(70% 80% at 30% 40%,#3E3A66 0%,#2D2A4A 62%)}
.hgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;padding-top:50px;padding-bottom:70px}
.kicker{font-size:12.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#FFC85C}
html[dir="rtl"] .kicker{letter-spacing:0;font-size:14.5px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(50px,7vw,96px);line-height:1;margin:16px 0 18px}
html[dir="rtl"] h1{line-height:1.2;font-size:clamp(44px,6vw,78px)}
.lead{font-size:18px;color:#D3C4AC;max-width:40ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{height:54px;padding:0 26px;border-radius:999px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:#FFC85C;color:var(--oud)}.btn-p:hover{background:#F2C687}
.btn-g{border:1px solid rgba(244,236,221,.4)}
.btn-d{background:var(--oud);color:#F4ECDD}
.ship{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;font-size:14.5px;color:#CFC0A8}
.burner{position:relative;aspect-ratio:1/1.05;max-width:520px;width:100%;margin-inline-start:auto}
.burner svg{width:100%;height:100%;overflow:visible}
.smoke path{fill:none;stroke:#EFE4D2;stroke-linecap:round;opacity:0;animation:rise 6s ease-in infinite}
.smoke path:nth-child(2){animation-delay:2s}.smoke path:nth-child(3){animation-delay:4s}
@keyframes rise{0%{opacity:0;transform:translateY(30px)}20%{opacity:.5}100%{opacity:0;transform:translateY(-110px)}}

.tagf{position:absolute;background:rgba(255,251,243,.96);color:var(--ink);border-radius:16px;padding:11px 15px;font-size:13px;box-shadow:0 18px 36px -20px #000}
.tagf b{display:block;font-size:15px}
.tA{bottom:16%;inset-inline-start:2%}.tB{top:16%;inset-inline-end:0}

section.block{padding-top:92px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--amber-d)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14.5px;font-weight:700}
h2{font-family:var(--display);font-weight:500;font-size:clamp(40px,5vw,64px);line-height:1.05;margin-top:8px}
.sub{color:var(--ink-2);max-width:44ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.tab[aria-pressed="true"]{background:var(--oud);color:#F4ECDD;border-color:var(--oud)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(60,40,20,.5)}
.card .art{aspect-ratio:1/1;position:relative}.card .art svg{width:100%;height:100%}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--oud);color:#FFC85C;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.15}
html[dir="rtl"] .body h3{font-size:18px}
.desc{color:var(--ink-2);font-size:13.5px;margin-top:4px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.price{font-weight:700;font-size:16px}.price small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.order{height:42px;padding:0 18px;border-radius:999px;background:var(--oud);color:#F4ECDD;font-weight:600;font-size:14px}
.order:hover{background:var(--amber-d)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grade{background:var(--oud);color:#EFE4D2;border-radius:26px;padding:26px;position:relative;overflow:hidden}
.grade .dot{width:46px;height:46px;border-radius:50%;margin-bottom:16px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.15)}
.grade h4{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
html[dir="rtl"] .grade h4{font-size:22px}
.grade p{color:#BFAE95;font-size:14.5px;margin-top:8px}
.grade .use{margin-top:14px;font-size:13px;color:#FFC85C;font-weight:600}
.world{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:32px;padding:38px}
.world ul{list-style:none;display:grid;gap:10px;margin-top:18px}
.world li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;font-size:15px}
.world li span:last-child{font-weight:700}
.globe svg{width:100%;max-width:380px;margin:0 auto}.grade .dot{display:grid;place-items:center}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px}
.rev .st{color:var(--amber);letter-spacing:2px}
.rev q{font-family:var(--display);font-size:24px;line-height:1.3;font-weight:500}
html[dir="rtl"] .rev q{font-size:18px}
.rev small{color:var(--muted);margin-top:auto}
footer{margin-top:96px;background:var(--oud);color:#BFAE95;padding:40px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer b{color:#F4ECDD;font-family:var(--display);font-size:22px}

.scrim{position:fixed;inset:0;background:rgba(20,13,8,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-modal .scrim,.show-drawer .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(880px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--card);border-radius:30px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
.show-modal .modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.notrans .drawer,.notrans .modal{transition:none!important}
.m-art{min-height:320px;position:relative}.m-art svg{position:absolute;inset:0;width:100%;height:100%}
.m-body{padding:28px 26px 24px;display:flex;flex-direction:column;gap:16px}
.m-body h3{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1}
html[dir="rtl"] .m-body h3{font-size:28px}
.x{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,251,243,.92);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;z-index:3}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:block}
html[dir="rtl"] .lbl{letter-spacing:0;font-size:14px;font-weight:700}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 28%;border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:start;background:#fff}
.pill b{display:block;font-weight:700}.pill span{font-size:13px;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--oud);box-shadow:inset 0 0 0 1px var(--oud)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.c{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;background:#fff}
.c small{color:var(--muted);margin-inline-start:4px}
.c[aria-pressed="true"]{background:var(--bg-2);border-color:var(--amber)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:50px;background:#fff}
.qty button{width:44px;height:100%;font-size:19px}.qty span{min-width:30px;text-align:center;font-weight:700}
.m-foot{display:flex;gap:12px;align-items:center}.m-foot .btn{flex:1}
.in{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}.in:focus{outline:none;border-color:var(--amber)}
.in::placeholder{color:#B3A595}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}.show-drawer .drawer,html[dir="rtl"] .show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:600;font-size:30px}.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.thumb{width:66px;height:66px;border-radius:14px;overflow:hidden;flex:none}.thumb svg{width:100%;height:100%}
.info{flex:1;min-width:0}.info b{display:block;font-weight:700}.info small{display:block;color:var(--muted);font-size:13px}
.rm{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:13px}
.sec{margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;width:100%;background:var(--card);margin-bottom:8px}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #C8B9A4;display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"]{border-color:var(--ink)}.opt[aria-pressed="true"] .r{border-color:var(--ink)}.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt span{flex:1;font-weight:600;font-size:14.5px}.opt span small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}.opt em{font-style:normal;font-weight:700}
.d-foot{border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:9px;background:var(--card)}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2)}.sum.total{font-size:19px;font-weight:800;color:var(--ink)}
.pay{height:58px;border-radius:999px;background:var(--oud);color:#F4ECDD;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.thw{background:#FFC85C;color:var(--oud);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:800}
.secure{font-size:12.5px;color:var(--muted);text-align:center}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#F7E1DC;color:var(--err)}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(20,13,8,.65);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}
.ps-top{background:var(--oud);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}.ps-top b{display:block;font-size:17px}.ps-top small{color:#BBB;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:#F6EAD6;color:#7A5320;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;font-size:14px;display:flex;justify-content:center;gap:8px}.ps-m[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.ps-pay{height:56px;border-radius:999px;background:var(--oud);color:#F4ECDD;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:#888;padding:4px}
.done{text-align:center;padding:22px 4px 8px}
.tick{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;background:var(--oud);display:grid;place-items:center;font-size:36px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--display);font-weight:600;font-size:34px}
.done p{color:var(--ink-2);margin-top:8px}
.ref{display:inline-block;margin-top:14px;background:var(--bg-2);font-weight:700;padding:7px 14px;border-radius:999px;font-size:14px}
.rcpt{margin-top:20px;border:1px dashed #CDBDA6;border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px;background:var(--card)}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted)}.rcpt span:last-child{text-align:end;font-weight:700}
.wag{animation:wag 2.6s ease-in-out infinite;transform-origin:330px 360px}@keyframes wag{50%{transform:rotate(-4deg)}}.bub{animation:bub 4s ease-in-out infinite}@keyframes bub{50%{transform:translateY(-14px)}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){.links{display:none}.hgrid{grid-template-columns:1fr;padding-top:30px}.burner{margin:0 auto;max-width:420px}
 .grid{grid-template-columns:1fr 1fr}.grades,.reviews{grid-template-columns:1fr}.world{grid-template-columns:1fr;padding:26px}
 .modal{grid-template-columns:minmax(0,1fr)}.m-art{min-height:240px}}
@media (max-width:620px){.wrap{padding-left:16px;padding-right:16px}.nav{gap:10px}.bn small{display:none}.bag-chip [data-t=bag]{display:none}.chip{padding:0 13px}
 .lead{font-size:16px}.grid{gap:12px}.body{padding:12px 12px 14px}.body h3{font-size:19px}html[dir="rtl"] .body h3{font-size:16px}.desc{display:none}
 .row{flex-direction:column;align-items:stretch;gap:8px}.order{height:40px}
 section.block{padding-top:72px}
 .modal{top:auto;bottom:0;left:0;width:100%;max-height:92%;border-radius:28px 28px 0 0;transform:translateY(100%)}.show-modal .modal{transform:none}.m-body{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ribbon" data-t="ribbon" data-html></div>
<div class="hdr" id="hdr"><div class="wrap nav">
  <a href="#top" class="brand"><span class="mark"><svg width="22" height="22" viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="5" ry="4.2" fill="#FFC85C"/><circle cx="6" cy="10" r="2.2" fill="#FFC85C"/><circle cx="10" cy="6.5" r="2.2" fill="#FFC85C"/><circle cx="14" cy="6.5" r="2.2" fill="#FFC85C"/><circle cx="18" cy="10" r="2.2" fill="#FFC85C"/></svg></span><span class="bn" data-t="brand" data-html></span></a>
  <nav class="links"><a href="#shop" data-t="navShop"></a><a href="#grades" data-t="navGr"></a><a href="#world" data-t="navShip"></a></nav>
  <div class="sp"></div>
  <button class="chip" id="lang" type="button"></button>
  <button class="chip bag-chip" id="openCart" type="button">🛍️ <span data-t="bag"></span><span class="count" id="count">0</span></button>
</div></div>

<main id="top">
  <section class="hero">
    <div class="wrap hgrid">
      <div class="reveal">
        <div class="kicker" data-t="kicker"></div>
        <h1 data-t="h1" data-html></h1>
        <p class="lead" data-t="lead"></p>
        <div class="cta"><a class="btn btn-p" href="#shop" data-t="cta1"></a><a class="btn btn-g" href="#grades" data-t="cta2"></a></div>
        <div class="ship"><span>★ 4.9 <span data-t="tr1"></span></span><span>🌍 <span data-t="tr2"></span></span><span>🎁 <span data-t="tr3"></span></span></div>
      </div>
      <div class="burner reveal" id="burner">
        <div class="tagf tA"><b data-t="tA"></b><span data-t="tAs"></span></div>
        <div class="tagf tB"><b data-t="tB"></b><span data-t="tBs"></span></div>
      </div>
    </div>
  </section>

  <section class="wrap block" id="shop">
    <div class="head reveal"><div><div class="eyebrow" data-t="shopEye"></div><h2 data-t="shopH" data-html></h2></div><p class="sub" data-t="shopSub"></p></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="wrap block" id="grades">
    <div class="head reveal"><div><div class="eyebrow" data-t="grEye"></div><h2 data-t="grH" data-html></h2></div><p class="sub" data-t="grSub"></p></div>

  $("#tabs").innerHTML=Object.entries(CATS).map(([k,v])=>`<button type="button" class="tab" data-tab="${k}" aria-pressed="${k===filt}">${v[lang]}</button>`).join("");
  $("#grid").innerHTML=PRODUCTS.filter(p=>filt==="all"||p.cat===filt).map(p=>`<article class="card"><div class="art">${art(p)}<span class="tag">${p.tag[lang]}</span></div>
   <div class="body"><h3>${p[lang].name}</h3><p class="desc">${p[lang].desc}</p><div class="row"><span class="price"><small>${t("from")}</small>${omr(p.sizes[0][1])}</span><button class="order" type="button" data-open="${p.id}">${t("choose")}</button></div></div></article>`).join("");
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v!=="string")return;el.hasAttribute("data-html")?el.innerHTML=v:el.textContent=v;});
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $("#lang").textContent=t("lang");
  $("#gradeList").innerHTML=GRADES.map(g=>`<div class="grade reveal in-view"><div class="dot" style="background:${g.c}"></div><h4>${g[lang][0]}</h4><p>${g[lang][1]}</p><div class="use">${g[lang][2]}</div></div>`).join("");
  $("#rates").innerHTML=t("rates").map(([a,b])=>`<li><span>${a}</span><span>${b}</span></li>`).join("");
  renderGrid();renderCart();if(cur)fillModal();
}
function openModal(id){cur=prod(id);curSize=cur.sizes[0][0];curAdds=[];curQty=cur.cat==="stay"?3:1;fillModal();document.body.classList.add("show-modal");}
function closeModal(){document.body.classList.remove("show-modal");cur=null;}
function fillModal(){const L=cur[lang];
  $("#mArt").innerHTML=art(cur,1);$("#mTag").textContent=cur.tag[lang];$("#mName").textContent=L.name;$("#mDesc").textContent=L.desc;
  $("#mSizeL").textContent=t("weight");
  $("#mSizes").innerHTML=cur.sizes.map(([id,pr])=>`<button type="button" class="pill" data-size="${id}" aria-pressed="${id===curSize}"><b>${W[id][lang]}</b><span>${omr(pr)}</span></button>`).join("");
  $("#mAdds").innerHTML=ADDS.map(a=>`<button type="button" class="c" data-add="${a.id}" aria-pressed="${curAdds.includes(a.id)}">${a.icon} ${a[lang]}<small>+${a.price/1000}</small></button>`).join("");
  $("#qN").textContent=curQty;
  $("#mAdd").textContent=`${t("add")} · ${omr(unit({id:cur.id,size:curSize,adds:curAdds})*curQty)}`;}
function addToCart(){cart.push({id:cur.id,size:curSize,adds:[...curAdds],qty:curQty});closeModal();renderCart();setTimeout(()=>openDrawer(true),300);}
function renderCart(){
  const {s,d,tot}=totals();$("#count").textContent=cart.reduce((a,c)=>a+c.qty,0);
  $("#lines").innerHTML=cart.length?cart.map((c,i)=>{const p=prod(c.id);return `<div class="line"><span class="thumb">${art(p)}</span><div class="info"><b>${p[lang].name}</b><small>${W[c.size][lang]} · ×${c.qty}</small>${c.adds.length?`<small>+ ${c.adds.map(a=>ADDS.find(x=>x.id===a)[lang]).join("، ")}</small>`:""}<small style="color:var(--ink);font-weight:700">${omr(unit(c)*c.qty)}</small></div><button class="rm" type="button" data-rm="${i}">✕</button></div>`}).join("")
   :`<div style="text-align:center;padding:40px 0;color:var(--muted)"><b style="display:block;color:var(--ink)">${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden=!cart.length;$("#addrWrap").hidden=deliv==="pickup";
  $("#dopt").innerHTML=DELIV.map(x=>`<button type="button" class="opt" data-del="${x.id}" aria-pressed="${x.id===deliv}"><i class="r"></i><span>${x[lang]}<small>${x.s[lang]}</small></span><em>${x.fee?omr(x.fee):t("free")}</em></button>`).join("");
  $("#sSub").textContent=omr(s);$("#sDel").textContent=d?omr(d):t("free");$("#sTot").textContent=omr(tot);
}
function openDrawer(v){document.body.classList.toggle("show-drawer",v);$("#drawer").setAttribute("aria-hidden",String(!v));}
function err(k){const m=$("#msg");m.textContent=k?t(k):"";m.classList.toggle("on",!!k);}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o)return openModal(o.dataset.open);
  const tb=e.target.closest("[data-tab]");if(tb){filt=tb.dataset.tab;return renderGrid();}
  const sz=e.target.closest("[data-size]");if(sz&&cur){curSize=sz.dataset.size;return fillModal();}
  const a=e.target.closest("[data-add]");if(a&&cur){const id=a.dataset.add;curAdds=curAdds.includes(id)?curAdds.filter(x=>x!==id):[...curAdds,id];return fillModal();}
  const r=e.target.closest("[data-rm]");if(r){cart.splice(+r.dataset.rm,1);return renderCart();}
  const dl=e.target.closest("[data-del]");if(dl){deliv=dl.dataset.del;err("");return renderCart();}
  const m=e.target.closest("[data-m]");if(m)document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));
});
$("#qInc").onclick=()=>{curQty=Math.min(curQty+1,30);fillModal();};$("#qDec").onclick=()=>{curQty=Math.max(curQty-1,1);fillModal();};
$("#mAdd").onclick=addToCart;$("#mClose").onclick=closeModal;
$("#openCart").onclick=()=>openDrawer(true);$("#dClose").onclick=()=>openDrawer(false);$("#scrim").onclick=()=>{closeModal();openDrawer(false);};
$("#lang").onclick=()=>{document.body.classList.add("notrans");setTimeout(()=>document.body.classList.remove("notrans"),60);lang=lang==="en"?"ar":"en";st.set("ht_lang",lang);applyLang();};
$("#pay").onclick=()=>{err("");if(!cart.length)return err("errEmpty");
  const name=$("#name").value.trim(),phone=$("#phone").value.replace(/\s/g,"");
  if(deliv!=="pickup"&&!$("#addr").value.trim())return err("errAddr");
  if(!name||!/^\+?\d{7,15}$/.test(phone))return err("errForm");
  const {tot}=totals();$("#psTot").textContent=omr(tot);$("#psPay").textContent=`${t("psPayBtn")} ${omr(tot)}`;$("#ps").classList.add("on");};
$("#psCancel").onclick=()=>$("#ps").classList.remove("on");
$("#psPay").onclick=()=>{$("#psPay").innerHTML='<span class="spin"></span>';
  setTimeout(()=>{$("#ps").classList.remove("on");const {tot}=totals(),ref="HT-"+Math.floor(1000+Math.random()*9000),n=cart.reduce((a,c)=>a+c.qty,0),dv=DELIV.find(x=>x.id===deliv);
    $("#lines").innerHTML=`<div class="done"><div class="tick">✨</div><h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
     <div class="rcpt"><div><span>${t("rItems")}</span><span>${cart.map(c=>esc(prod(c.id)[lang].name)).join("، ")} (${n})</span></div><div><span>${t("rDel")}</span><span>${dv[lang]}</span></div><div><span>${t("rPaid")}</span><span>${omr(tot)}</span></div></div>
     <button type="button" class="btn btn-d" id="again" style="margin-top:20px;width:100%">${t("again")}</button></div>`;
    $("#checkout").hidden=true;$("#dFoot").hidden=true;cart=[];$("#count").textContent=0;
    $("#again").onclick=()=>{openDrawer(false);$("#dFoot").hidden=false;renderCart();window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(function init(){
  lang=st.get("ht_lang")||"en";
  $("#burner").insertAdjacentHTML("afterbegin",heroSVG());$("#globe").innerHTML=globeSVG();
  applyLang();document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
</body>
</html>
