<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cakes And Dreams · Baked Fresh For You · Salalah</title>
<meta name="description" content="Order ube, chocolate and celebration cakes online in Salalah. Pay securely with Thawani. Pickup or delivery, even to Hawana hotels.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B1D2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F4; --card:#FFFFFF; --ink:#2B1D2E; --ink-2:#5B4A5E; --muted:#8D7F90;
  --ube:#7A55A8; --ube-d:#5E3F87; --lav:#EFE7F8; --blush:#F7E6EA; --gold:#C9A46A; --line:#EEE5DF;
  --ok:#2F7D4F; --err:#B4372F;
  --display:"Playfair Display",Georgia,serif; --body:"DM Sans",system-ui,sans-serif;
  --r:22px; --sh:0 18px 40px -22px rgba(43,29,46,.35); --sh-s:0 6px 18px -10px rgba(43,29,46,.3);
}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.serif-i{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500}
html[dir="rtl"] .serif-i{font-family:"Tajawal";font-style:normal;font-weight:800}

/* concept ribbon */
.ribbon{background:var(--ink);color:#E9DDEB;font-size:12.5px;text-align:center;padding:8px 14px;letter-spacing:.01em}
.ribbon b{color:#D9C2F2;font-weight:700}

/* nav */
header{position:sticky;top:0;z-index:30;background:rgba(251,247,244,.86);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{height:72px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#9673C4,var(--ube-d));display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),var(--sh-s)}
.brand-name{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand-name small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
html[dir="rtl"] .brand-name small{letter-spacing:0}
.links{display:flex;gap:26px;margin-inline-start:18px;font-size:15px;color:var(--ink-2)}
.links a:hover{color:var(--ube)}
.sp{flex:1}
.chip{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,transform .15s}
.chip:hover{border-color:#CDBBDE}
.cart-chip{background:var(--ink);color:#fff;border-color:var(--ink)}
.cart-chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#D9C2F2;color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center}
.count.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:56px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ube)}
html[dir="rtl"] .kicker{letter-spacing:0}
.kicker i{width:28px;height:1.5px;background:var(--ube);display:block}
h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,6.4vw,78px);line-height:1;letter-spacing:-.025em;margin:20px 0 22px}
h1 .serif-i{color:var(--ube)}
.lead{font-size:18.5px;color:var(--ink-2);max-width:34ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{height:56px;padding:0 28px;border-radius:16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--ube);color:#fff;box-shadow:0 14px 28px -14px rgba(122,85,168,.9)}
.btn-p:hover{background:var(--ube-d)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-g:hover{border-color:#CDBBDE}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;font-size:14px;color:var(--ink-2)}
.trust span{display:flex;align-items:center;gap:8px}
.trust svg{flex:none}
.stage{position:relative;aspect-ratio:1/1.02;max-width:520px;margin-inline-start:auto;width:100%}
.arch{position:absolute;inset:4% 8% 0;border-radius:999px 999px 36px 36px;background:linear-gradient(180deg,#EADFF7 0%,#F6EEF9 55%,#FBF4F1 100%);box-shadow:inset 0 0 0 1px rgba(122,85,168,.08)}
.arch::after{content:"";position:absolute;inset:14px;border-radius:inherit;border:1.5px dashed rgba(122,85,168,.22)}
.hero-cake{position:absolute;left:6%;right:6%;bottom:6%;filter:drop-shadow(0 30px 30px rgba(43,29,46,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.spark{position:absolute;color:var(--gold);animation:tw 3.2s ease-in-out infinite}
.spark.a{top:12%;left:14%}.spark.b{top:26%;right:10%;animation-delay:-1.2s}.spark.c{top:8%;right:30%;animation-delay:-2s;color:#B794E0}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.badge{position:absolute;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.badge{width:max-content}
.badge > div{text-align:start}
.badge small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.badge.bA{left:-6%;top:16%}
.badge.bB{right:-4%;bottom:5%}
.badge .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--lav);font-size:17px}

/* marquee */
.marquee{border-block:1px solid var(--line);background:#fff;overflow:hidden;white-space:nowrap;padding:16px 0}
.track{display:inline-flex;gap:44px;animation:mq 30s linear infinite;font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink-2)}
html[dir="rtl"] .track{font-style:normal;animation-direction:reverse}
.track span{display:inline-flex;align-items:center;gap:44px}
.track span::after{content:"✦";font-style:normal;font-size:13px;color:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section.block{padding-top:96px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ube)}
html[dir="rtl"] .eyebrow{letter-spacing:0}
h2{font-family:var(--display);font-size:clamp(34px,4.4vw,52px);line-height:1.05;letter-spacing:-.02em;margin-top:10px}
.sub{color:var(--ink-2);max-width:46ch}

/* menu */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--card);border-radius:26px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.art{position:relative;height:230px;display:grid;place-items:center;overflow:hidden}
.art svg{width:78%;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card:hover .art svg{transform:scale(1.04) translateY(-4px)}
.tag{position:absolute;top:16px;inset-inline-start:16px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);color:var(--ink);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:var(--display);font-size:24px;letter-spacing:-.01em}
.desc{color:var(--ink-2);font-size:14.5px;margin-top:6px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.from{font-size:13px;color:var(--muted)}
.from b{display:block;color:var(--ink);font-size:19px}
.order{height:46px;padding:0 20px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;transition:background .2s}
.order:hover{background:var(--ube)}

/* how */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.step{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}
.step .n{font-family:var(--display);font-style:italic;font-size:40px;color:var(--ube);line-height:1}
html[dir="rtl"] .step .n{font-style:normal}
.step h4{font-size:19px;margin:14px 0 6px}
.step p{color:var(--ink-2);font-size:15px}

/* custom band */
.band{margin-top:96px;border-radius:32px;background:radial-gradient(120% 140% at 0% 0%,#8C68BD 0%,#5E3F87 55%,#3F2A5C 100%);color:#fff;padding:52px;display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.06);right:-90px;top:-140px}
.band h3{font-family:var(--display);font-size:clamp(28px,3.4vw,40px);line-height:1.1;letter-spacing:-.01em}
.band p{color:#E6DAF3;margin-top:12px;max-width:44ch}
.band .btn{background:#fff;color:var(--ink);justify-self:end;position:relative}
.band .btn:hover{background:#F3ECFA}

/* reviews */
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rev{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.rev q{font-family:var(--display);font-size:21px;line-height:1.3;quotes:"“" "”"}
html[dir="rtl"] .rev q{font-size:19px}
.rev small{color:var(--muted);font-size:13px;margin-top:auto}

/* visit */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px}
.hours{display:grid;gap:10px;margin-top:18px}
.hours div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:10px;font-size:15px}
.hours div span:last-child{color:var(--ink-2)}
.mapcard{border-radius:26px;overflow:hidden;position:relative;min-height:300px;background:
 linear-gradient(0deg,rgba(43,29,46,.0),rgba(43,29,46,0)),
 repeating-linear-gradient(90deg,#F1EAE4 0 1px,transparent 1px 46px),
 repeating-linear-gradient(0deg,#F1EAE4 0 1px,transparent 1px 46px),#F8F3EF;border:1px solid var(--line)}
.road{position:absolute;background:#fff;box-shadow:0 0 0 1px #ECE2DA}
.pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin .bubble{background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:14px;white-space:nowrap;box-shadow:var(--sh)}
.pin .stem{width:16px;height:16px;background:var(--ube);border:4px solid #fff;border-radius:50%;margin-top:10px;box-shadow:0 0 0 8px rgba(122,85,168,.18)}
.mapcard .btn{position:absolute;left:24px;right:24px;bottom:24px}

footer{margin-top:96px;background:var(--ink);color:#D9CDDC;padding:44px 0}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px}
footer b{color:#fff;font-family:var(--display);font-size:20px}

/* modal + drawer shared */
.scrim{position:fixed;inset:0;background:rgba(43,29,46,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-modal .scrim,.show-drawer .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(860px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:30px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
.show-modal .modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.m-art{display:grid;place-items:center;padding:30px;min-height:320px}
.m-art svg{width:90%}
.m-body{padding:34px 32px 28px;display:flex;flex-direction:column;gap:18px}
.m-body h3{font-family:var(--display);font-size:32px;line-height:1.05}
.x{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.lbl{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:block}
.sizes{display:flex;flex-wrap:wrap;gap:10px}
.size{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;text-align:start;min-width:96px;transition:.15s}
.size b{display:block;font-size:15px}
.size span{font-size:13px;color:var(--muted)}
.size[aria-pressed="true"]{border-color:var(--ube);background:var(--lav);box-shadow:0 0 0 3px rgba(122,85,168,.12)}
.in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;transition:border-color .15s}
.in:focus{outline:none;border-color:var(--ube)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;height:50px}
.qty button{width:46px;height:100%;font-size:20px;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:800}
.m-foot{display:flex;gap:12px;align-items:center;margin-top:auto}
.m-foot .btn{flex:1;white-space:nowrap;padding:0 18px;font-size:15px}

.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:#fff;z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}
.show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-size:28px}
.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.line .thumb{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;flex:none}
.line .thumb svg{width:86%}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:15.5px}
.line .info small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .qty{height:38px;border-radius:12px}
.line .qty button{width:34px;font-size:17px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.empty svg{width:120px;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.sec{margin-top:22px}
.ful{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:start;width:100%}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #CFC3D3;flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--ube);background:var(--lav)}
.opt[aria-pressed="true"] .r{border-color:var(--ube)}
.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ube)}
.opt span{flex:1;font-size:14.5px;font-weight:600}
.opt em{font-style:normal;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-foot{border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:10px;background:#FFFDFC}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2)}
.sum.total{font-size:19px;font-weight:800;color:var(--ink)}
.pay{height:58px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s}
.pay:hover{background:#3E2B42}
.pay:disabled{opacity:.4;cursor:not-allowed}
.thw{background:#fff;color:var(--ink);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:800}
.secure{font-size:12.5px;color:var(--muted);text-align:center}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#FBE9E7;color:var(--err)}
.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;font-size:14.5px;opacity:0;transition:.3s;z-index:70;box-shadow:var(--sh);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* demo payment sheet + confirmation */
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(43,29,46,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:28px;overflow:hidden;transform:translateY(16px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 60px -25px rgba(43,29,46,.6)}
.ps.on .ps-card{transform:none}
.ps-top{background:var(--ink);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.ps-top b{display:block;font-size:17px}.ps-top small{color:#CFC3D3;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:var(--lav);color:var(--ube-d);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.ps-row{display:flex;justify-content:space-between;font-size:15px;color:var(--ink-2)}
.ps-row.big{font-size:22px;font-weight:800;color:var(--ink)}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:center}
.ps-m[aria-pressed="true"]{border-color:var(--ube);background:var(--lav)}
.ps-pay{height:56px;border-radius:16px;background:var(--ube);color:#fff;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.ps-cancel{font-size:14px;color:var(--muted);text-align:center;padding:4px}
.done{text-align:center;padding:26px 6px 10px}
.done .tick{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle,#EADCF7,#D9C2F2);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.done h4{font-family:var(--display);font-size:30px;line-height:1.1}
.done p{color:var(--ink-2);margin-top:8px}
.done .ref{display:inline-block;margin-top:14px;background:var(--lav);color:var(--ube-d);font-weight:800;padding:7px 14px;border-radius:999px;font-size:14px}
.rcpt{margin-top:22px;border:1px dashed #D9CCE0;border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted)}
.rcpt div span:last-child{text-align:end;font-weight:600}
.again{margin-top:20px;width:100%}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){
  .links{display:none}
  .hero{grid-template-columns:1fr;padding-top:36px;gap:28px}
  .stage{max-width:420px;margin:0 auto;order:-1}
  .grid,.reviews{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr}
  .band{grid-template-columns:1fr;padding:36px}
  .band .btn{justify-self:start}
  .visit{grid-template-columns:1fr}
  .modal{grid-template-columns:minmax(0,1fr)}
  .m-art{min-height:220px;padding:20px}
  .m-art svg{width:62%}
}
@media (max-width:620px){
  .wrap{padding-left:18px;padding-right:18px}
  .grid,.reviews{grid-template-columns:1fr}
  .brand-name small{display:none}
  .chip.lang{padding:0 12px}
  .badge.bA{left:0;top:10%}
  .badge.bB{right:0;bottom:2%}
  .nav{gap:10px}
  .cart-chip [data-t=cart]{display:none}
  .chip{padding:0 13px}
  .lead{font-size:16.5px}
  section.block{padding-top:72px}
  .band{margin-top:72px}
  .modal{top:auto;bottom:0;left:0;width:100%;max-height:92%;border-radius:28px 28px 0 0;transform:translateY(100%)}
  .show-modal .modal{transform:none}
  .m-body{padding:26px 20px 22px}
  .m-foot .btn{font-size:14px;padding:0 12px}
  .size{min-width:0;flex:1 1 40%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

    psTitle: "دفع آمن", psDemo: "معاينة تجريبية: في الموقع الحقيقي هذه الخطوة هي صفحة ثواني الآمنة للدفع بالبطاقة.", psCard: "بطاقة", psPayBtn: "ادفع", psCancel: "إلغاء",
    doneH: "تم تأكيد طلبك!", doneP: "شكراً لك! بنراسلك على واتساب لما تكون كيكتك جاهزة.", doneRef: "طلب", rWhen: "الموعد", rHow: "الاستلام / التوصيل", rPaid: "المدفوع", rItems: "الأصناف", again: "رجوع للقائمة",
    errAddr: "اكتب عنوان التوصيل أو اسم الفندق.", errNet: "هذه معاينة، فالدفع غير متصل بعد. يشتغل بعد ربط الموقع بحساب ثواني الخاص بكم.",
    lang: "English", sizes: { "1kg": "١ كجم", "1.5kg": "١.٥ كجم", "2kg": "٢ كجم", box6: "علبة ٦", box12: "علبة ١٢" },
    serves: { "1kg": "تكفي ٦–٨", "1.5kg": "تكفي ١٠–١٢", "2kg": "تكفي ١٤–١٦", box6: "٦ حبات", box12: "١٢ حبة" }
  }
};

/* ---------- cake illustrations ---------- */
let uid = 0;
function cakeSVG(a, kind){
  const id = "c" + (++uid);
  if (kind === "cupcakes") return cupcakeSVG(a, id);
  const cx = 110, top = 72, rx = 70, ry = 14, bot = 148;
  const frontY = x => top + ry * Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2));
  const band = (y, h, c) => `<path d="M${cx-rx} ${y} A${rx} ${ry} 0 0 0 ${cx+rx} ${y} L${cx+rx} ${y+h} A${rx} ${ry} 0 0 1 ${cx-rx} ${y+h} Z" fill="${c}"/>`;
  const drips = [46,58,71,85,99,113,127,141,155,168].map((x,i) => {
    const h = [16,24,12,28,18,26,14,22,30,15][i]; const y = frontY(x) - 4;
    return `<rect x="${x-5}" y="${y}" width="10" height="${h}" rx="5" fill="${a.drip}"/>`;
  }).join("");
  let tops = "";
  if (a.top === "dollops") tops = [[72,66],[91,61],[110,59],[129,61],[148,66],[82,76],[110,79],[138,76]].map(([x,y],i)=>
    `<g><circle cx="${x}" cy="${y}" r="9" fill="${a.cream}"/><circle cx="${x-2.5}" cy="${y-3}" r="3" fill="#fff" opacity=".7"/>${i%2?`<circle cx="${x}" cy="${y-9}" r="2.6" fill="${a.accent}"/>`:""}</g>`).join("");
  if (a.top === "shards") tops = [[78,52,"#3A2016"],[96,46,"#C9A27E"],[114,44,"#3A2016"],[132,48,"#7A4A30"],[146,56,"#C9A27E"]].map(([x,y,c],i)=>
    `<polygon points="${x},${y} ${x+12},${y+6} ${x+8},${y+26} ${x-4},${y+22}" fill="${c}" transform="rotate(${[-12,8,-4,14,-8][i]} ${x} ${y+12})"/>`).join("")
    + `<circle cx="104" cy="74" r="4" fill="#D94A5C"/><circle cx="118" cy="76" r="4" fill="#D94A5C"/>`;
  if (a.top === "cubes") tops = [[76,66],[92,61],[108,64],[124,60],[140,65],[86,75],[104,77],[122,76],[138,74]].map(([x,y],i)=>
    `<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="3" fill="${i%3?a.drip:a.accent}" transform="rotate(${i*17} ${x} ${y})"/>`).join("")
    + `<path d="M100 56c4-8 12-10 18-8-3 6-10 10-18 8Z" fill="#6FAF5B"/>`;
  if (a.top === "berries") tops = [[78,68,"#C8233C"],[92,62,"#3B4C9B"],[106,60,"#C8233C"],[120,62,"#C8233C"],[134,64,"#3B4C9B"],[146,69,"#C8233C"],[96,76,"#C8233C"],[116,77,"#3B4C9B"],[132,75,"#C8233C"]].map(([x,y,c])=>
    `<g><circle cx="${x}" cy="${y}" r="6.5" fill="${c}"/><circle cx="${x-2}" cy="${y-2.5}" r="1.8" fill="#fff" opacity=".6"/></g>`).join("")
    + `<path d="M104 54c3-5 8-6 12-5-2 4-7 6-12 5Z" fill="#5E9E4E"/>`;
  if (a.top === "glaze") tops = `<ellipse cx="96" cy="66" rx="26" ry="4" fill="#fff" opacity=".35"/>`
    + [[84,74],[110,78],[136,74]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#FFF1CF"/>`).join("")
    + `<circle cx="110" cy="62" r="7" fill="#C8233C"/><path d="M110 55c1-5 4-7 7-8" stroke="#5E9E4E" stroke-width="2" fill="none"/>`;
  return `<svg viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".14"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></linearGradient></defs>
  <ellipse cx="110" cy="174" rx="92" ry="9" fill="#2B1D2E" opacity=".12"/>
  <ellipse cx="110" cy="164" rx="90" ry="15" fill="#E8DED6"/><ellipse cx="110" cy="161" rx="90" ry="15" fill="#fff"/>
  <path d="M${cx-rx} ${top} L${cx-rx} ${bot} A${rx} ${ry} 0 0 0 ${cx+rx} ${bot} L${cx+rx} ${top} Z" fill="${a.sponge}"/>
  ${band(100,7,a.cream)}${band(126,7,a.cream)}
  <path d="M${cx-rx} ${top} L${cx-rx} ${bot} A${rx} ${ry} 0 0 0 ${cx+rx} ${bot} L${cx+rx} ${top} Z" fill="url(#${id}s)"/>
  ${drips}
  <ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" fill="${a.drip}"/>
  <ellipse cx="${cx}" cy="${top-1}" rx="${rx-6}" ry="${ry-3}" fill="${a.top==='glaze'||a.top==='shards'?a.drip:a.cream}" opacity="${a.top==='glaze'||a.top==='shards'?1:.95}"/>
  ${tops}
  </svg>`;
}
function cupcakeSVG(a, id){
  const one = (x, s, fr, sp) => `<g transform="translate(${x} 0) scale(${s})" >
    <path d="M-30 96 L30 96 L22 150 L-22 150 Z" fill="${a.sponge}"/>
    ${[-20,-10,0,10,20].map(v=>`<path d="M${v*1} 96 L${v*0.75} 150" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>`).join("")}
    <ellipse cx="0" cy="94" rx="34" ry="12" fill="${fr}"/><ellipse cx="0" cy="80" rx="28" ry="12" fill="${fr}"/><ellipse cx="0" cy="66" rx="20" ry="10" fill="${fr}"/><path d="M0 46c6 6 8 12 0 18-8-6-6-12 0-18Z" fill="${fr}"/>
    <ellipse cx="-8" cy="76" rx="8" ry="3" fill="#fff" opacity=".55"/>
    ${sp}
  </g>`;
  const spr = c => [[-14,86,c[0],20],[8,90,c[1],-30],[-2,74,c[2],60],[14,78,c[0],-10],[-16,96,c[1],40]].map(([x,y,col,r])=>`<rect x="${x}" y="${y}" width="7" height="2.6" rx="1.3" fill="${col}" transform="rotate(${r} ${x} ${y})"/>`).join("");
  return `<svg viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <ellipse cx="110" cy="174" rx="92" ry="9" fill="#2B1D2E" opacity=".12"/>
  <ellipse cx="110" cy="164" rx="90" ry="15" fill="#E8DED6"/><ellipse cx="110" cy="161" rx="90" ry="15" fill="#fff"/>
  ${one(62,.82,"#EADCF7",spr(["#7A55A8","#F6B93B","#E0475C"]))}
  ${one(158,.82,"#8B5A3C",spr(["#F6D58C","#fff","#E0475C"]))}
  <g transform="translate(0 4)">${one(110,1,"#FFFFFF",spr(["#7A55A8","#F7A8C0","#F6B93B"]))}<circle cx="110" cy="44" r="7" fill="#C8233C"/><path d="M110 37c1-6 5-8 8-9" stroke="#5E9E4E" stroke-width="2" fill="none"/></g>
  </svg>`;
}
const tint = a => `radial-gradient(90% 80% at 50% 70%, ${a.accent}33 0%, transparent 70%), linear-gradient(180deg, ${a.accent}22, #FBF7F4)`;

/* ---------- state ---------- */
let lang = "en", P = [], D = [], cart = [], ful = "pickup", cur = null, curSize = null, curQty = 1;
const $ = s => document.querySelector(s);
const st = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const t = k => T[lang][k];
const omr = b => (lang === "ar" ? (b/1000).toFixed(3) + " ر.ع" : (b/1000).toFixed(3) + " OMR");
const prod = id => P.find(p => p.id === id);
const price = (id, size) => (prod(id)?.sizes.find(s => s.id === size) || {}).price || 0;

function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (v == null) return; el.hasAttribute("data-html") ? el.innerHTML = v : el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = t(el.dataset.tp));
  document.querySelectorAll(".flipx").forEach(el => el.style.transform = lang === "ar" ? "scaleX(-1)" : "");
  $("#lang").textContent = t("lang");
  const items = t("marquee").map(x => `<span>${x}</span>`).join("");
  $("#track").innerHTML = items + items;
  const waText = encodeURIComponent(lang === "ar" ? "مرحبا! أبغى كيكة بتصميم خاص 🎂" : "Hi! I'd like a custom cake design 🎂");
  $("#waCustom").href = $("#waBand").href = `https://wa.me/${WA}?text=${waText}`;
  buildSlots(); renderMenu(); renderCart(); if (cur) fillModal();
}

function renderMenu(){
  $("#grid").innerHTML = P.map(p => {
    const L = p[lang], min = Math.min(...p.sizes.map(s => s.price));
    return `<article class="card reveal in-view">
      <div class="art" style="background:${tint(p.art)}">${L.tag ? `<span class="tag">${L.tag}</span>` : ""}${cakeSVG(p.art, p.id)}</div>
      <div class="body"><h3>${L.name}</h3><p class="desc">${L.desc}</p>
        <div class="row"><div class="from">${t("from")}<b>${omr(min)}</b></div><button class="order" type="button" data-open="${p.id}">${t("orderBtn")}</button></div>
      </div></article>`;
  }).join("");
}

/* modal */
function openModal(id){ cur = prod(id); curSize = cur.sizes[0].id; curQty = 1; $("#mMsg").value = ""; fillModal(); document.body.classList.add("show-modal"); setTimeout(()=>$("#mClose").focus(), 50); }
function closeModal(){ document.body.classList.remove("show-modal"); cur = null; }
function fillModal(){
  const L = cur[lang];
  $("#mArt").style.background = tint(cur.art); $("#mArt").innerHTML = cakeSVG(cur.art, cur.id);
  $("#mTag").textContent = L.tag || t("menuEye"); $("#mName").textContent = L.name; $("#mDesc").textContent = L.desc;
  $("#mSizes").innerHTML = cur.sizes.map(s => `<button type="button" class="size" data-size="${s.id}" aria-pressed="${s.id===curSize}"><b>${t("sizes")[s.id]}</b><span>${t("serves")[s.id]} · ${omr(s.price)}</span></button>`).join("");
  $("#msgWrap").hidden = cur.id === "cupcakes";
  $("#mQty").textContent = curQty;
  $("#mAdd").textContent = `${t("add")} · ${omr(price(cur.id, curSize) * curQty)}`;
}

/* cart */
function addToCart(){
  const msg = $("#mMsg").value.trim();
  const ex = cart.find(c => c.id === cur.id && c.size === curSize && c.msg === msg);
  ex ? ex.qty = Math.min(ex.qty + curQty, 20) : cart.push({ id: cur.id, size: curSize, qty: curQty, msg });
  closeModal(); renderCart(); toast(t("added"));
  const c = $("#count"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}
function renderCart(){
  cart = cart.filter(c => c.qty > 0 && prod(c.id));
  const sub = cart.reduce((s, c) => s + price(c.id, c.size) * c.qty, 0);
  const del = (D.find(d => d.id === ful) || { price: 0 }).price;
  $("#count").textContent = cart.reduce((s, c) => s + c.qty, 0);
  $("#lines").innerHTML = cart.length ? cart.map((c, i) => { const p = prod(c.id);
    return `<div class="line"><span class="thumb" style="background:${tint(p.art)}">${cakeSVG(p.art, p.id)}</span>
      <div class="info"><b>${p[lang].name}</b><small>${t("sizes")[c.size]}${c.msg ? ` · “${c.msg.replace(/</g,"&lt;")}”` : ""}</small><small>${omr(price(c.id, c.size) * c.qty)}</small></div>
      <div class="qty"><button type="button" data-dec="${i}" aria-label="Less">−</button><span>${c.qty}</span><button type="button" data-inc="${i}" aria-label="More">+</button></div></div>`; }).join("")
    : `<div class="empty">${cakeSVG({sponge:"#EADCF7",cream:"#fff",drip:"#D9C2F2",top:"dollops",accent:"#B794E0"}, "e")}<b>${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden = !cart.length;
  $("#ful").innerHTML = D.map(d => `<button type="button" class="opt" data-ful="${d.id}" aria-pressed="${d.id===ful}"><i class="r"></i><span>${d[lang]}</span><em>${d.price ? "+" + omr(d.price) : t("free")}</em></button>`).join("");
  $("#addrWrap").hidden = ful === "pickup";
  $("#sSub").textContent = omr(sub); $("#sDel").textContent = del ? omr(del) : t("free"); $("#sTot").textContent = omr(cart.length ? sub + del : 0);
  $("#pay").disabled = !cart.length;
  st.set("cd_cart", cart); st.set("cd_ful", ful);
}
function buildSlots(){
  const day = $("#day"), time = $("#time"), kd = day.value, kt = time.value; day.innerHTML = ""; time.innerHTML = "";
  for (let i = 1; i <= 7; i++){ const d = new Date(); d.setDate(d.getDate() + i);
    const lbl = i === 1 ? t("tomorrow") : d.toLocaleDateString(lang === "ar" ? "ar-OM" : "en-GB", { weekday: "short", day: "numeric", month: "short" });
    day.add(new Option(lbl, d.toISOString().slice(0, 10))); }
  const slots = ["10:00","11:00","12:00","17:00","18:00","19:00","20:00","21:00","22:00"];
  slots.forEach(s => { const h = +s.slice(0,2), h12 = h > 12 ? h - 12 : h; time.add(new Option(lang === "ar" ? `${h12}:00 ${h < 12 ? "ص" : "م"}` : `${h12}:00 ${h < 12 ? "am" : "pm"}`, s)); });
  if (kd) day.value = kd; if (kt) time.value = kt;
}
function openDrawer(v){ document.body.classList.toggle("show-drawer", v); $("#drawer").setAttribute("aria-hidden", String(!v)); }
function err(k){ const m = $("#msg"); m.textContent = k ? t(k) : ""; m.classList.toggle("on", !!k); }
let tt; function toast(s){ const el = $("#toast"); el.textContent = "✓ " + s; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1800); }

/* events */
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) return openModal(o.dataset.open);
  const s = e.target.closest("[data-size]"); if (s && cur){ curSize = s.dataset.size; return fillModal(); }
  const f = e.target.closest("[data-ful]"); if (f){ ful = f.dataset.ful; err(""); return renderCart(); }
  const i = e.target.closest("[data-inc]"); if (i){ cart[+i.dataset.inc].qty = Math.min(cart[+i.dataset.inc].qty + 1, 20); return renderCart(); }
  const d = e.target.closest("[data-dec]"); if (d){ cart[+d.dataset.dec].qty--; return renderCart(); }
});
$("#mInc").onclick = () => { curQty = Math.min(curQty + 1, 20); fillModal(); };
$("#mDec").onclick = () => { curQty = Math.max(curQty - 1, 1); fillModal(); };
$("#mAdd").onclick = addToCart;
$("#mClose").onclick = closeModal;
$("#openCart").onclick = () => openDrawer(true);
$("#dClose").onclick = () => openDrawer(false);
$("#scrim").onclick = () => { closeModal(); openDrawer(false); };
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeModal(); openDrawer(false); } });
$("#lang").onclick = () => { lang = lang === "en" ? "ar" : "en"; st.set("cd_lang", lang); applyLang(); };
window.addEventListener("scroll", () => $("#hdr").classList.toggle("scrolled", scrollY > 8), { passive: true });

const DEMO = true; // mockup: no real payment, shows a labelled demo step instead
function totals(){ const sub = cart.reduce((s, c) => s + price(c.id, c.size) * c.qty, 0); const del = (D.find(d => d.id === ful) || { price: 0 }).price; return { sub, del, tot: sub + del }; }
$("#pay").onclick = async () => {
  err("");
  const name = $("#name").value.trim(), phone = $("#phone").value.trim(), address = $("#address").value.trim();
  if (!cart.length) return err("errEmpty");
  if (!name || !/^\+?\d[\d\s]{6,14}$/.test(phone)) return err("errForm");
  if (ful !== "pickup" && !address) return err("errAddr");
  if (DEMO){ $("#psTot").textContent = omr(totals().tot); $("#psPay").textContent = `${t("psPayBtn")} ${omr(totals().tot)}`; $("#ps").classList.add("on"); return; }
  const btn = $("#pay"), old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shop: "cakes-and-dreams", items: cart, name, phone, address, delivery: ful, date: $("#day").value, time: $("#time").value }) });
    const data = await r.json(); if (!r.ok || !data.url) throw 0;
    location.href = data.url;
  } catch (e) { err("errNet"); btn.disabled = false; btn.innerHTML = old; }
};
document.addEventListener("click", e => { const m = e.target.closest("[data-m]"); if (m) document.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", String(x === m))); });
$("#psCancel").onclick = () => $("#ps").classList.remove("on");
$("#psPay").onclick = () => {
  const b = $("#psPay"); b.innerHTML = '<span class="spin"></span>';
  setTimeout(() => {
    $("#ps").classList.remove("on");
    const { tot } = totals(), ref = "CD-" + Math.floor(1000 + Math.random() * 9000);
    const d = D.find(x => x.id === ful), dayTxt = $("#day").selectedOptions[0].text + " · " + $("#time").selectedOptions[0].text;
    const n = cart.reduce((s, c) => s + c.qty, 0), esc = v => String(v).replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;");
    $("#lines").innerHTML = `<div class="done"><div class="tick"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#5E3F87" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
      <div class="rcpt"><div><span>${t("rItems")}</span><span>${n}</span></div><div><span>${t("rHow")}</span><span>${esc(d[lang])}</span></div><div><span>${t("rWhen")}</span><span>${esc(dayTxt)}</span></div><div><span>${t("rPaid")}</span><span>${omr(tot)}</span></div></div>
      <button type="button" class="btn btn-g again" id="again">${t("again")}</button></div>`;
    $("#checkout").hidden = true; document.querySelector(".d-foot").hidden = true;
    cart = []; st.set("cd_cart", cart); $("#count").textContent = 0;
    $("#again").onclick = () => { openDrawer(false); document.querySelector(".d-foot").hidden = false; renderCart(); location.hash = "#menu"; };
  }, 1300);
};

const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting){ x.target.classList.add("in-view"); io.unobserve(x.target); } }), { threshold: .12 }) : null;

(async function init(){
  lang = st.get("cd_lang") || (navigator.language || "").startsWith("ar") && "ar" || "en";
  cart = st.get("cd_cart") || []; ful = st.get("cd_ful") || "pickup";
  try { const c = await (await fetch("catalog.json")).json(); P = c.products; D = c.delivery; } catch (e) {}
  $("#heroCake").innerHTML = cakeSVG(P[0] ? P[0].art : {sponge:"#8E6BB8",cream:"#EADCF7",drip:"#6B4A97",top:"dollops",accent:"#B794E0"}, "hero");
  applyLang();
  document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in-view"));
})();
</script>
</body>
</html>
