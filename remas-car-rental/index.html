<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remas Car Rental Salalah · Book online, final price upfront</title>
<meta name="description" content="Rent a car in Salalah. Delivered to the airport or your hotel. See the final price before you book.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F3B33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F9;--card:#fff;--ink:#0D1B2A;--ink-2:#4F5D6B;--muted:#8A96A3;--line:#E3E8EE;
 --navy:#0F3B33;--navy-2:#1A5A4C;--or:#E8A317;--or-d:#C98A0C;--ok:#18A06B;--err:#C8432F;
 --body:"Manrope",system-ui,sans-serif}
html[dir="rtl"]{--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit;color:inherit}svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.ribbon{background:#000;color:#C5CDD6;font-size:12.5px;text-align:center;padding:8px 14px}.ribbon b{color:#FF9A6B}
header{position:sticky;top:0;z-index:30;background:rgba(13,43,69,.94);backdrop-filter:blur(14px);color:#fff}
.nav{height:72px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--or);display:grid;place-items:center}
.bn{font-weight:800;font-size:18px;line-height:1.05;letter-spacing:-.01em}
.bn small{display:block;font-size:10.5px;letter-spacing:.24em;color:#9DB3C8;margin-top:3px;font-weight:700}
html[dir="rtl"] .bn small{letter-spacing:0;font-size:11.5px}
.links{display:flex;gap:24px;margin-inline-start:16px;font-size:14.5px;color:#B9CADB;font-weight:600}.links a:hover{color:#fff}
.sp{flex:1}
.chip{white-space:nowrap;height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.wa{background:#fff;color:var(--navy);border-color:#fff}

.hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding-bottom:120px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -40% -10%;height:60%;background:radial-gradient(50% 60% at 50% 0%,rgba(232,163,23,.28),transparent 70%)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding-top:40px;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700}
.pill i{color:#FFC94D;font-style:normal}
h1{font-weight:800;font-size:clamp(42px,6vw,76px);line-height:1.02;letter-spacing:-.03em;margin:18px 0 16px}
html[dir="rtl"] h1{letter-spacing:0;line-height:1.2}
h1 em{font-style:normal;color:var(--or)}
.lead{font-size:18px;color:#C3D2E1;max-width:42ch}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-weight:700;font-size:14.5px}
.checks span::before{content:"✓";color:#5FE0A6;margin-inline-end:6px}
.carart{position:relative}.otw{position:absolute;top:8%;inset-inline-end:4%;background:#fff;color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 16px 30px -18px #000;font-size:13px}.otw b{display:block;font-size:14.5px}.otw span{color:var(--ok);font-weight:800}.carart svg{width:100%;height:auto}

.search{position:relative;z-index:5;margin-top:-80px;background:var(--card);border-radius:24px;box-shadow:0 30px 60px -30px rgba(13,43,69,.45);padding:18px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:12px;align-items:end}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
html[dir="rtl"] .field label{letter-spacing:0;font-size:13px}
.in{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-weight:600}.in:focus{outline:none;border-color:var(--navy)}
.stepper{display:flex;align-items:center;justify-content:space-between;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--bg);font-size:19px;font-weight:700}
.stepper b{font-size:16px}
.btn{height:52px;padding:0 26px;border-radius:14px;font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-o{background:var(--or);color:#fff}.btn-o:hover{background:var(--or-d)}
.btn-n{background:var(--navy);color:#fff}
.btn-g{border:1px solid var(--line);background:#fff}

section.block{padding-top:84px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--or-d)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
h2{font-weight:800;font-size:clamp(32px,4vw,48px);line-height:1.08;letter-spacing:-.02em;margin-top:8px}
html[dir="rtl"] h2{letter-spacing:0}
.sub{color:var(--ink-2);max-width:46ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.fleet{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.car{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.car:hover{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(13,43,69,.45)}
.car .ct{display:flex;justify-content:space-between;align-items:start;gap:10px}
.car h3{font-size:19px;font-weight:800;line-height:1.2}.car .sim{font-size:13px;color:var(--muted);font-weight:600}
.badge{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:#FFF0E8;color:var(--or-d);white-space:nowrap}
.car .pic{height:140px;margin:10px 0}.car .pic svg{width:100%;height:100%}
.specs{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-weight:600}
.cb{display:flex;justify-content:space-between;align-items:end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cb .pr b{font-size:24px;font-weight:800;letter-spacing:-.02em}.cb .pr small{color:var(--muted);font-weight:600}
.cb .tot{font-size:12.5px;color:var(--ink-2);font-weight:600}
.book{height:46px;padding:0 20px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:14.5px}
.book:hover{background:var(--or)}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.st{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.st .n{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.st h4{font-size:17px;margin:14px 0 4px}.st p{color:var(--ink-2);font-size:14.5px}
.honest{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;background:var(--navy);color:#fff;border-radius:30px;padding:38px}
.honest h2{color:#fff}.honest .sub{color:#B9CADB}
.bill{background:#fff;color:var(--ink);border-radius:20px;padding:20px;display:grid;gap:10px;font-size:15px}
.bill div{display:flex;justify-content:space-between}.bill .t{border-top:1px dashed var(--line);padding-top:12px;font-weight:800;font-size:19px}
.bill .ok{color:var(--ok);font-weight:800;font-size:13px;text-align:center;display:block}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rev{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px}
.rev .s{color:#FFB21E;letter-spacing:2px}.rev q{font-weight:700;font-size:17px;line-height:1.4}.rev small{color:var(--muted);margin-top:auto}
footer{margin-top:90px;background:var(--navy);color:#9DB3C8;padding:36px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer b{color:#fff;font-size:18px}

.scrim{position:fixed;inset:0;background:rgba(13,27,42,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-drawer .scrim{opacity:1;pointer-events:auto}
.notrans .drawer{transition:none!important}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}.show-drawer .drawer,html[dir="rtl"] .show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);background:#fff}
.d-head h3{font-size:22px;font-weight:800}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.d-body{flex:1;overflow:auto;padding:4px 22px 22px}
.sel{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:16px}
.sel .pic{width:110px;height:60px;flex:none}.sel .pic svg{width:100%;height:100%}
.sel b{display:block;font-weight:800}.sel small{color:var(--muted);font-weight:600}
.sec{margin-top:18px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:block}
html[dir="rtl"] .lbl{letter-spacing:0;font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.c{border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:14px;background:#fff}
.c small{color:var(--muted);margin-inline-start:4px;font-weight:600}
.c[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}.c[aria-pressed="true"] small{color:#B9CADB}
.add{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;width:100%;background:#fff;margin-bottom:8px}
.add .bx{width:22px;height:22px;border-radius:7px;border:2px solid #C5CED8;display:grid;place-items:center;flex:none;font-size:13px;font-weight:900;color:#fff}
.add[aria-pressed="true"]{border-color:var(--navy)}.add[aria-pressed="true"] .bx{background:var(--navy);border-color:var(--navy)}.add[aria-pressed="true"] .bx::after{content:"✓"}
.add span{flex:1;font-weight:700;font-size:14.5px}.add span small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}.add em{font-style:normal;font-weight:800;font-size:14px}
.d-foot{border-top:1px solid var(--line);padding:16px 22px 20px;display:grid;gap:7px;background:#fff}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);font-weight:600}.sum.total{font-size:19px;font-weight:800;color:var(--ink)}
.final{font-size:12.5px;color:var(--ok);font-weight:800;text-align:center}
.pay{height:56px;border-radius:14px;background:var(--or);color:#fff;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.thw{background:#fff;color:var(--or-d);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:800}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#FBE5E1;color:var(--err);font-weight:600}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(13,27,42,.65);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:26px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}
.ps-top{background:var(--navy);color:#fff;padding:20px 22px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}.ps-top b{display:block;font-size:17px}.ps-top small{color:#9DB3C8;font-size:12.5px}
.ps-body{padding:22px;display:grid;gap:16px}
.ps-demo{background:#FFF0E8;color:#A2421A;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:700;font-size:14px;display:flex;justify-content:center;gap:8px}.ps-m[aria-pressed="true"]{border-color:var(--navy);background:var(--bg)}
.ps-pay{height:54px;border-radius:14px;background:var(--or);color:#fff;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:#888;padding:4px}
.done{text-align:center;padding:20px 0 6px}
.tick{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:800;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-size:28px;font-weight:800}.done p{color:var(--ink-2);margin-top:6px}
.rcpt{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted);font-weight:600}.rcpt span:last-child{text-align:end;font-weight:800}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){.links{display:none}.hgrid{grid-template-columns:1fr}.carart{max-width:520px}
 .search{grid-template-columns:1fr 1fr}.search .go{grid-column:span 2}.fleet{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr 1fr}.honest{grid-template-columns:1fr;padding:26px}.reviews{grid-template-columns:1fr}}
@media (max-width:620px){.wrap{padding-left:16px;padding-right:16px}.nav{gap:10px}.bn small{display:none}.wa span{display:none}.chip{padding:0 13px}
 .hero{padding-bottom:110px}.lead{font-size:16px}.search{grid-template-columns:1fr;padding:14px}.search .go{grid-column:auto}
 .fleet{grid-template-columns:1fr}.how{grid-template-columns:1fr}section.block{padding-top:64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ribbon" data-t="ribbon" data-html></div>
<header><div class="wrap nav">
  <a href="#top" class="brand"><span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 15l2-6a2 2 0 0 1 2-1.4h8A2 2 0 0 1 18 9l2 6v3h-2.5M4 15v3h2.5M4 15h16M9 18h6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="18" r="1.6" fill="#fff"/><circle cx="16.5" cy="18" r="1.6" fill="#fff"/></svg></span><span class="bn">Remas Car Rental<small data-t="tagline"></small></span></a>
  <nav class="links"><a href="#fleet" data-t="navFleet"></a><a href="#how" data-t="navHow"></a><a href="#price" data-t="navPrice"></a></nav>
  <div class="sp"></div>
  <button class="chip" id="lang" type="button"></button>
  <a class="chip wa" href="#fleet">🚗 <span data-t="bookNow"></span></a>
</div></header>

<main id="top">
  <section class="hero">
    <div class="wrap hgrid">
      <div class="reveal">
        <span class="pill"><i>★ 4.9</i> <span data-t="pillT"></span></span>
        <h1 data-t="h1" data-html></h1>
        <p class="lead" data-t="lead"></p>
        <div class="checks"><span data-t="c1"></span><span data-t="c2"></span><span data-t="c3"></span></div>
      </div>
      <div class="carart reveal"><div id="heroCar"></div><div class="otw"><b data-t="otw"></b><span data-t="otwS"></span></div></div>
    </div>
  </section>
  <div class="wrap">
    <div class="search reveal in-view">
      <div class="field"><label data-t="where"></label><select class="in" id="place"></select></div>
      <div class="field"><label data-t="from"></label><select class="in" id="date"></select></div>
      <div class="field"><label data-t="days"></label><div class="stepper"><button type="button" id="dDec">−</button><b id="dN"></b><button type="button" id="dInc">+</button></div></div>
      <a class="btn btn-o go" href="#fleet" data-t="see"></a>
    </div>
  </div>

  <section class="wrap block" id="fleet">
    <div class="head reveal"><div><div class="eyebrow" data-t="flEye"></div><h2 data-t="flH"></h2></div><p class="sub" data-t="flSub"></p></div>
    <div class="tabs" id="tabs"></div>
    <div class="fleet" id="cars"></div>
  </section>

  <section class="wrap block" id="price">
    <div class="honest reveal">
      <div><div class="eyebrow" style="color:#FF9A6B" data-t="prEye"></div><h2 data-t="prH"></h2><p class="sub" style="margin-top:10px" data-t="prP"></p></div>
      <div class="bill" id="bill"></div>
    </div>
  </section>

  <section class="wrap block" id="how">
    <div class="head reveal"><div><div class="eyebrow" data-t="hwEye"></div><h2 data-t="hwH"></h2></div></div>
    <div class="how"><div class="st reveal"><div class="n">1</div><h4 data-t="s1"></h4><p data-t="s1p"></p></div><div class="st reveal"><div class="n">2</div><h4 data-t="s2"></h4><p data-t="s2p"></p></div><div class="st reveal"><div class="n">3</div><h4 data-t="s3"></h4><p data-t="s3p"></p></div><div class="st reveal"><div class="n">4</div><h4 data-t="s4"></h4><p data-t="s4p"></p></div></div>
  </section>

  <section class="wrap block">
    <div class="head reveal"><div><div class="eyebrow" data-t="rvEye"></div><h2 data-t="rvH"></h2></div></div>
    <div class="reviews"><figure class="rev reveal"><div class="s">★★★★★</div><q data-t="r1"></q><small data-t="rSrc"></small></figure><figure class="rev reveal"><div class="s">★★★★★</div><q data-t="r2"></q><small data-t="rSrc"></small></figure><figure class="rev reveal"><div class="s">★★★★★</div><q data-t="r3"></q><small data-t="rSrc"></small></figure></div>
  </section>
</main>
<footer><div class="wrap"><div><b>Remas Car Rental</b><div data-t="foot1"></div></div><div data-t="foot2"></div></div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="d-head"><h3 data-t="dH"></h3><button class="x" id="dClose" type="button" aria-label="Close">✕</button></div>
  <div class="d-body">
    <div id="form">
      <div class="sel" id="sel"></div>
      <div class="sec"><span class="lbl" data-t="deliverTo"></span><div class="chips" id="places"></div></div>
      <div class="sec"><span class="lbl" data-t="days"></span><div class="stepper" style="background:#fff"><button type="button" id="d2Dec">−</button><b id="d2N"></b><button type="button" id="d2Inc">+</button></div></div>
      <div class="sec"><span class="lbl" data-t="extras"></span><div id="extras"></div></div>
      <div class="sec"><label class="lbl" for="name" data-t="name"></label><input class="in" id="name" autocomplete="name"></div>
      <div class="sec"><label class="lbl" for="phone" data-t="phone"></label><input class="in" id="phone" inputmode="tel" placeholder="+44 7700 900000" dir="ltr"></div>
    </div>
    <div id="done" hidden></div>
  </div>

(function init(){
  lang=st.get("mr_lang")||"en";
  $("#heroCar").innerHTML=heroSVG();
  applyLang();document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
