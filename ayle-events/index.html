<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYLE EVENTS · Surprises, flowers & celebrations · Salalah</title>
<meta name="description" content="Book surprise setups, rose bouquets and flower boxes in Salalah. Plan from anywhere, pay online, get photos on WhatsApp.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E2729">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F5; --card:#fff; --ink:#2E2729; --ink-2:#5E5457; --muted:#948A8C; --line:#EEE6E1;
  --rose:#B85C6E; --rose-d:#96475A; --blush:#F6E4E2; --sage:#7E9C81; --sage-l:#E6EFE6; --gold:#C8A15A;
  --err:#B4372F; --display:"Cormorant Garamond",Georgia,serif; --body:"Jost",system-ui,sans-serif;
  --sh:0 18px 40px -22px rgba(46,39,41,.35); --sh-s:0 6px 18px -10px rgba(46,39,41,.3);
}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.it{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500}
html[dir="rtl"] .it{font-family:"Tajawal";font-style:normal;font-weight:800}

.ribbon{background:var(--ink);color:#EDE3E0;font-size:12.5px;text-align:center;padding:8px 14px}
.ribbon b{color:#E9CFA0}
header{position:sticky;top:0;z-index:30;background:rgba(251,248,245,.88);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{height:74px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:#fff}
.bn{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.14em;line-height:1}
.bn small{display:block;font-family:var(--body);font-size:10.5px;font-weight:500;letter-spacing:.22em;color:var(--muted);margin-top:5px}
html[dir="rtl"] .bn small{letter-spacing:0}
.links{display:flex;gap:26px;margin-inline-start:16px;font-size:15px;color:var(--ink-2)}
.links a:hover{color:var(--rose)}
.sp{flex:1}
.chip{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:#E2C9C6}
.cart-chip{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#E9CFA0;color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.count.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.35)}}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding-top:60px;padding-bottom:56px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .kicker{letter-spacing:0}
.kicker i{width:28px;height:1.5px;background:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(48px,7vw,86px);line-height:.98;letter-spacing:-.015em;margin:18px 0 20px}
h1 .it{color:var(--rose)}
.lead{font-size:18.5px;color:var(--ink-2);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{height:56px;padding:0 28px;border-radius:999px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,background .2s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--rose);color:#fff;box-shadow:0 14px 28px -14px rgba(184,92,110,.9)}
.btn-p:hover{background:var(--rose-d)}
.btn-g{background:#fff;border:1px solid var(--line)}
.btn-g:hover{border-color:#E2C9C6}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:32px;font-size:14px;color:var(--ink-2)}
.trust span{display:flex;align-items:center;gap:8px}
.stage{position:relative;max-width:520px;width:100%;margin-inline-start:auto;aspect-ratio:1/1.02}
.oval{position:absolute;inset:3% 6% 0;border-radius:48% 48% 40px 40px/36% 36% 40px 40px;background:linear-gradient(180deg,#F6E4E2,#FBF2EE 60%,#EFF4EE)}
.oval::after{content:"";position:absolute;inset:12px;border-radius:inherit;border:1px solid rgba(200,161,90,.45)}
.hero-art{position:absolute;left:4%;right:4%;bottom:4%;filter:drop-shadow(0 26px 26px rgba(46,39,41,.16))}
.badge{position:absolute;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;width:max-content;max-width:240px}
.badge small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.badge > div{text-align:start}
.badge .d{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--blush);font-size:18px;flex:none}
.bA{left:-5%;top:14%}.bB{right:-3%;bottom:7%}
.petal{position:absolute;width:14px;height:9px;border-radius:50% 0;background:#E7A8B3;opacity:.8;animation:fall 7s linear infinite}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(60px) rotate(220deg);opacity:0}}

.marquee{border-block:1px solid var(--line);background:#fff;overflow:hidden;white-space:nowrap;padding:16px 0}
.track{display:inline-flex;gap:44px;animation:mq 34s linear infinite;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:25px;color:var(--ink-2)}
html[dir="rtl"] .track{font-family:"Tajawal";font-style:normal;font-size:20px;animation-direction:reverse}
.track span{display:inline-flex;align-items:center;gap:44px}
.track span::after{content:"❀";font-style:normal;font-size:14px;color:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

section.block{padding-top:92px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .eyebrow{letter-spacing:0}
h2{font-family:var(--display);font-weight:600;font-size:clamp(38px,4.8vw,58px);line-height:1.02;margin-top:8px}
.sub{color:var(--ink-2);max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid + .head{margin-top:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.art{height:240px;position:relative;display:grid;place-items:center;overflow:hidden}
.art svg{width:80%;transition:transform .4s}
.card:hover .art svg{transform:scale(1.04)}
.tag{position:absolute;top:16px;inset-inline-start:16px;background:rgba(255,255,255,.92);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.1}
.desc{color:var(--ink-2);font-size:14.5px;margin-top:6px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.from{font-size:13px;color:var(--muted)}
.from b{display:block;color:var(--ink);font-size:19px;font-weight:600}
.order{height:46px;padding:0 22px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;transition:background .2s}
.order:hover{background:var(--rose)}

.band{margin-top:92px;border-radius:34px;background:radial-gradient(120% 140% at 100% 0%,#A9C2AB 0%,#7E9C81 45%,#4E6B53 100%);color:#fff;padding:54px;display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.18);left:-120px;bottom:-220px}
.band h3{font-family:var(--display);font-weight:600;font-size:clamp(32px,3.8vw,46px);line-height:1.05}
.band p{color:#EAF2EA;margin-top:12px;max-width:46ch}
.band .btn{background:#fff;color:var(--ink);justify-self:end;position:relative}
.band ul{list-style:none;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.band li{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 13px;font-size:13px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.step{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px}
.step .n{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:46px;color:var(--gold);line-height:1}
.step h4{font-size:19px;font-weight:600;margin:12px 0 6px}
.step p{color:var(--ink-2);font-size:15px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rev{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:14px}
.stars{color:var(--gold);letter-spacing:2px}
.rev q{font-family:var(--display);font-size:25px;line-height:1.2;font-weight:600}
html[dir="rtl"] .rev q{font-size:19px}
.rev small{color:var(--muted);margin-top:auto}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px}
.hours{display:grid;gap:10px;margin-top:18px}
.hours div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:10px}
.hours span:last-child{color:var(--ink-2)}
.mapcard{border-radius:28px;overflow:hidden;position:relative;min-height:300px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,#F0E8E3 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,#F0E8E3 0 1px,transparent 1px 46px),#F8F3EF}
.road{position:absolute;background:#fff;box-shadow:0 0 0 1px #EADFD8}
.pin{position:absolute;left:50%;top:42%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin .bubble{background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 14px;border-radius:14px;white-space:nowrap;letter-spacing:.08em}
.pin .stem{width:16px;height:16px;background:var(--rose);border:4px solid #fff;border-radius:50%;margin-top:10px;box-shadow:0 0 0 8px rgba(184,92,110,.18)}
.mapcard .btn{position:absolute;left:24px;right:24px;bottom:24px}
footer{margin-top:92px;background:var(--ink);color:#E4D8D5;padding:44px 0}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px}
footer b{color:#fff;font-family:"Cormorant Garamond",serif;font-size:22px;letter-spacing:.14em}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(46,39,41,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-modal .scrim,.show-drawer .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(900px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:30px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
.show-modal .modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.m-art{display:grid;place-items:center;padding:30px;min-height:320px}
.m-art svg{width:92%}
.m-body{padding:32px 30px 26px;display:flex;flex-direction:column;gap:16px}
.m-body h3{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05}
.x{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.lbl{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;text-align:start;min-width:0;flex:1 1 30%}
.pill b{display:block;font-size:15px;font-weight:600}
.pill span{font-size:13px;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--rose);background:var(--blush);box-shadow:0 0 0 3px rgba(184,92,110,.12)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-size:13.5px;font-weight:500}
html[dir="rtl"] .swatch{padding:6px 6px 6px 12px}
.swatch i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch[aria-pressed="true"]{border-color:var(--rose);background:var(--blush)}
.adds{display:flex;flex-wrap:wrap;gap:8px}
.add{border:1.5px dashed #DCCFCB;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:500}
.add em{font-style:normal;color:var(--muted);margin-inline-start:4px}
.add[aria-pressed="true"]{border-style:solid;border-color:var(--sage);background:var(--sage-l)}
.in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}
.in:focus{outline:none;border-color:var(--rose)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:52px}
.qty button{width:46px;height:100%;font-size:20px}
.qty span{min-width:28px;text-align:center;font-weight:600}
.m-foot{display:flex;gap:12px;align-items:center;margin-top:auto}
.m-foot .btn{flex:1;white-space:nowrap;padding:0 18px;font-size:15px}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:#fff;z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}
.show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:700;font-size:30px}
.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.thumb{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;flex:none}
.thumb svg{width:88%}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600}
.info small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .qty{height:38px}
.line .qty button{width:34px;font-size:17px}
.empty{text-align:center;padding:46px 10px;color:var(--muted)}
.empty svg{width:130px;margin:0 auto 10px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600}
.sec{margin-top:20px}
.ful{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:start;width:100%}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #DCCFCB;display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"]{border-color:var(--rose);background:var(--blush)}
.opt[aria-pressed="true"] .r{border-color:var(--rose)}
.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--rose)}
.opt span{flex:1;font-size:14.5px;font-weight:500}
.opt em{font-style:normal;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-foot{border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:10px;background:#FFFDFB}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2)}
.sum.total{font-size:19px;font-weight:600;color:var(--ink)}
.pay{height:58px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.pay:disabled{opacity:.4;cursor:not-allowed}
.thw{background:#fff;color:var(--ink);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:700}
.secure{font-size:12.5px;color:var(--muted);text-align:center}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#FBE9E7;color:var(--err)}
.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:999px;font-weight:500;opacity:0;transition:.3s;z-index:70;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* demo payment */
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(46,39,41,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}
.ps.on .ps-card{transform:none}
.ps-top{background:var(--ink);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.ps-top b{display:block;font-size:17px;font-weight:600}.ps-top small{color:#D9CCC8;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:var(--blush);color:var(--rose-d);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:500}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:600}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:600;font-size:14px;display:flex;justify-content:center;gap:8px}
.ps-m[aria-pressed="true"]{border-color:var(--rose);background:var(--blush)}
.ps-pay{height:56px;border-radius:999px;background:var(--rose);color:#fff;font-weight:600;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:var(--muted);padding:4px}
.done{text-align:center;padding:24px 4px 8px}
.tick{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle,#EEF5EE,#CFE2D0);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1}
.done p{color:var(--ink-2);margin-top:8px}
.ref{display:inline-block;margin-top:14px;background:var(--blush);color:var(--rose-d);font-weight:600;padding:7px 14px;border-radius:999px;font-size:14px}
.rcpt{margin-top:20px;border:1px dashed #E2CFCB;border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted)}.rcpt span:last-child{text-align:end;font-weight:500}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){
  .links{display:none}
  .hero{grid-template-columns:1fr;padding-top:34px;gap:26px}
  .stage{max-width:430px;margin:0 auto;order:-1}

    ${leaf(72,80,-40,1.3)}${leaf(148,80,40,1.3)}${leaf(66,104,-20,1.1)}${leaf(154,104,20,1.1)}${leaf(104,40,-70)}${leaf(118,40,70)}
    <path d="M56 96 L110 186 L164 96 Q110 116 56 96Z" fill="${l}" stroke="${m}" stroke-opacity=".35"/>
    <path d="M70 100 L110 186 L150 100 Q110 112 70 100Z" fill="#F7EFE6"/>
    ${pos.map(([x,y,r],i)=>rose(x,y,r,i%3===2?"#FFFFFF":(i%2?m:d),i%3===2?l:d)).join("")}
    <path d="M100 144 q-14 -10 -20 2 q8 8 20 -2 M120 144 q14 -10 20 2 q-8 8 -20 -2" fill="${d}"/><circle cx="110" cy="144" r="5" fill="${d}"/>
    <path d="M106 148 l-6 22 M114 148 l6 22" stroke="${d}" stroke-width="3" stroke-linecap="round"/></svg>`;
  }
  if(type==="box"){
    const top=[[78,96],[94,90],[110,88],[126,90],[142,96],[86,104],[102,102],[118,102],[134,104],[110,112],[70,108],[150,108]];
    return `<svg viewBox="0 0 220 200">${plate}
    <path d="M52 110 L52 168 A58 14 0 0 0 168 168 L168 110 Z" fill="${d}"/>
    <path d="M52 110 L52 168 A58 14 0 0 0 168 168 L168 110 Z" fill="url(#bx${++uid})"/>
    <defs><linearGradient id="bx${uid}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs>
    <rect x="52" y="140" width="116" height="9" fill="${g}" opacity=".9"/>
    <ellipse cx="110" cy="110" rx="58" ry="14" fill="${l}"/>
    ${top.map(([x,y],i)=>rose(x,y,11,i%3===1?"#fff":m,d)).join("")}
    ${leaf(64,100,-30,.9)}${leaf(156,100,30,.9)}
    <text x="110" y="162" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="11" letter-spacing="3" fill="#fff" opacity=".9">AYLE</text></svg>`;
  }
  if(type==="choco"){
    let ch=""; for(let r=0;r<2;r++) for(let c=0;c<4;c++) ch+=`<circle cx="${86+c*18}" cy="${132+r*18}" r="7" fill="${(r+c)%2?'#5A3524':'#7A4A30'}"/><circle cx="${84+c*18}" cy="${130+r*18}" r="2" fill="#fff" opacity=".3"/>`;
    return `<svg viewBox="0 0 220 200">${plate}
    <path d="M58 112 L162 112 L172 174 L48 174 Z" fill="${d}"/><path d="M66 118 L154 118 L160 168 L60 168 Z" fill="#F7EFE6"/>${ch}
    <rect x="58" y="104" width="104" height="10" rx="3" fill="${g}"/>
    ${leaf(132,86,-30)}${leaf(146,92,30)}${rose(126,84,13,m,d)}${rose(146,80,11,"#fff",l)}${rose(108,90,10,d,m)}
    <path d="M70 104 q-12 -14 -2 -20 q8 8 2 20 M80 104 q10 -14 2 -20 q-8 8 -2 20" fill="${m}"/></svg>`;
  }
  if(type==="balloons"){
    const bs=[[70,62,20,m],[96,44,22,l],[124,48,21,d],[150,64,19,g],[84,86,17,d],[136,84,18,m],[110,72,19,"#fff"]];
    return `<svg viewBox="0 0 220 200">${plate}
    <path d="M40 176 h140" stroke="#E4D8D3" stroke-width="2"/>
    <rect x="66" y="132" width="88" height="40" rx="6" fill="#fff" stroke="#EADFDA"/>
    <path d="M70 140 l10 10 l10 -10 l10 10 l10 -10 l10 10 l10 -10 l10 10 l10 -10" fill="none" stroke="${d}" stroke-width="2"/>
    <text x="110" y="166" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="14" fill="${d}">Happy Birthday</text>
    ${bs.map(([x,y,r,c])=>balloon(x,y,r,c)).join("")}
    ${rose(60,150,9,m,d)}${rose(160,150,9,m,d)}${leaf(50,156,-20,.8)}${leaf(170,156,20,.8)}</svg>`;
  }
  // setup / proposal
  const prop = type==="proposal";
  let arch=""; for(let i=0;i<=16;i++){ const a=Math.PI-(Math.PI*i/16); const x=110+62*Math.cos(a), y=104-62*Math.sin(a); arch+=rose(x,y,i%2?9:10,i%3?m:(i%2?"#fff":d),d); }
  const candles=[48,64,156,172].map((x,i)=>`<rect x="${x-3}" y="${158-(i%2?8:0)}" width="6" height="${16+(i%2?8:0)}" rx="2" fill="#FFF8EA"/><ellipse cx="${x}" cy="${154-(i%2?8:0)}" rx="2.6" ry="4.2" fill="#F6B93B"/><circle cx="${x}" cy="${154-(i%2?8:0)}" r="7" fill="#F6B93B" opacity=".18"/>`).join("");
  const petals=[[80,176],[96,180],[124,179],[140,176],[110,182],[70,181],[150,181]].map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="4" ry="2.4" fill="${i%2?m:d}" transform="rotate(${i*40} ${x} ${y})"/>`).join("");
  const center = prop ? `<text x="110" y="118" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="25" fill="${d}">Marry me?</text><text x="110" y="118" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="25" fill="none" stroke="${m}" stroke-opacity=".5" stroke-width="3" opacity=".5">Marry me?</text>`
    : `<path d="M110 136 C 82 116 88 92 104 96 C 108 97 110 101 110 103 C 110 101 112 97 116 96 C 132 92 138 116 110 136Z" fill="${d}"/><path d="M100 104 q4 -4 8 0" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>`;
  return `<svg viewBox="0 0 220 200">${plate}
   <ellipse cx="110" cy="178" rx="86" ry="10" fill="${l}"/>
   <path d="M48 176 V104 A62 62 0 0 1 172 104 V176" fill="none" stroke="${l}" stroke-width="7"/>${arch}
   ${leaf(46,120,-80)}${leaf(174,120,80)}${leaf(52,82,-50)}${leaf(168,82,50)}
   ${center}${candles}${petals}
   ${prop?"":balloon(34,128,13,m)+balloon(186,128,13,d)+balloon(24,108,11,g)+balloon(196,108,11,l)}</svg>`;
}
const tint = th => `radial-gradient(90% 80% at 50% 72%, ${th.c[0]}33 0%, transparent 70%), linear-gradient(180deg, ${th.c[1]}, #FBF8F5)`;

/* ---------- state ---------- */
let lang="en",P=[],D=[],A=[],TH=[],cart=[],ful="hotels",cur=null,curSize=null,curTheme="blush",curAdds=[],curQty=1;
const $=s=>document.querySelector(s);
const st={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const t=k=>T[lang][k];
const omr=b=>lang==="ar"?(b/1000).toFixed(3)+" ر.ع":(b/1000).toFixed(3)+" OMR";
const prod=id=>P.find(p=>p.id===id), theme=id=>TH.find(x=>x.id===id)||TH[0];
const unit=c=>(prod(c.id).sizes.find(s=>s.id===c.size)||{price:0}).price+c.adds.reduce((s,a)=>s+(A.find(x=>x.id===a)||{price:0}).price,0);
const esc=v=>String(v).replace(/[<&"]/g,c=>({"<":"&lt;","&":"&amp;",'"':"&quot;"}[c]));

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(v==null)return;el.hasAttribute("data-html")?el.innerHTML=v:el.textContent=v;});
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $("#lang").textContent=t("lang");
  const it=t("marquee").map(x=>`<span>${x}</span>`).join("");$("#track").innerHTML=it+it;
  $("#waBand").href=`https://wa.me/${WA}?text=${encodeURIComponent(lang==="ar"?"مرحبا! أبغى أخطط لمفاجأة 💐":"Hi! I'd like to plan a surprise 💐")}`;
  buildSlots();renderMenu();renderCart();if(cur)fillModal();
}
function card(p){const L=p[lang],min=Math.min(...p.sizes.map(s=>s.price)),th=theme(p.id==="roses"?"red":p.id==="giftbox"?"gold":p.id==="birthday"?"lilac":"blush");
  return `<article class="card"><div class="art" style="background:${tint(th)}">${L.tag?`<span class="tag">${L.tag}</span>`:""}${art(p.art,th)}</div>
  <div class="body"><h3>${L.name}</h3><p class="desc">${L.desc}</p><div class="row"><div class="from">${t("from")}<b>${omr(min)}</b></div><button class="order" type="button" data-open="${p.id}">${t("orderBtn")}</button></div></div></article>`;}
function renderMenu(){ $("#gridSetups").innerHTML=P.filter(p=>p.kind==="setup").map(card).join(""); $("#gridGifts").innerHTML=P.filter(p=>p.kind==="gift").map(card).join(""); }

function openModal(id){cur=prod(id);curSize=cur.sizes[0].id;curTheme=id==="roses"?"red":id==="giftbox"?"gold":id==="birthday"?"lilac":"blush";curAdds=[];curQty=1;$("#mMsg").value="";fillModal();document.body.classList.add("show-modal");}
function closeModal(){document.body.classList.remove("show-modal");cur=null;}
function fillModal(){
  const L=cur[lang],th=theme(curTheme);
  $("#mArt").style.background=tint(th);$("#mArt").innerHTML=art(cur.art,th);
  $("#mTag").textContent=L.tag||t(cur.kind==="setup"?"setEye":"giftEye");$("#mName").textContent=L.name;$("#mDesc").textContent=L.desc;
  $("#mSizes").innerHTML=cur.sizes.map(s=>`<button type="button" class="pill" data-size="${s.id}" aria-pressed="${s.id===curSize}"><b>${t("sizes")[s.id]}</b><span>${t("sizeSub")[s.id]} · ${omr(s.price)}</span></button>`).join("");
  $("#mThemes").innerHTML=TH.map(x=>`<button type="button" class="swatch" data-theme="${x.id}" aria-pressed="${x.id===curTheme}"><i style="background:linear-gradient(135deg,${x.c[0]} 50%,${x.c[1]} 50%)"></i>${x[lang]}</button>`).join("");
  $("#addWrap").hidden=!cur.addons;
  $("#mAdds").innerHTML=A.map(a=>`<button type="button" class="add" data-add="${a.id}" aria-pressed="${curAdds.includes(a.id)}">${a.icon} ${a[lang]}<em>+${(a.price/1000).toFixed(0)}</em></button>`).join("");
  $("#qtyBox").hidden=cur.kind==="setup";$("#mQty").textContent=curQty;
  $("#mAdd").textContent=`${t("add")} · ${omr(unit({id:cur.id,size:curSize,adds:curAdds})*curQty)}`;
}
function addToCart(){cart.push({id:cur.id,size:curSize,theme:curTheme,adds:[...curAdds],msg:$("#mMsg").value.trim(),qty:curQty});closeModal();renderCart();toast(t("added"));const c=$("#count");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");}
function totals(){const sub=cart.reduce((s,c)=>s+unit(c)*c.qty,0),del=(D.find(d=>d.id===ful)||{price:0}).price;return{sub,del,tot:cart.length?sub+del:0};}
function renderCart(){
  cart=cart.filter(c=>c.qty>0&&prod(c.id));
  const {sub,del,tot}=totals();
  $("#count").textContent=cart.reduce((s,c)=>s+c.qty,0);
  $("#lines").innerHTML=cart.length?cart.map((c,i)=>{const p=prod(c.id),th=theme(c.theme);const extra=[t("sizes")[c.size],th[lang],...c.adds.map(a=>(A.find(x=>x.id===a)||{})[lang])].join(" · ");
    return `<div class="line"><span class="thumb" style="background:${tint(th)}">${art(p.art,th)}</span><div class="info"><b>${p[lang].name}</b><small>${esc(extra)}</small>${c.msg?`<small>“${esc(c.msg)}”</small>`:""}<small>${omr(unit(c)*c.qty)}</small></div>
    <div class="qty"><button type="button" data-dec="${i}">−</button><span>${c.qty}</span><button type="button" data-inc="${i}">+</button></div></div>`}).join("")
   :`<div class="empty">${art("bouquet",theme("blush"))}<b>${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden=!cart.length;
  $("#ful").innerHTML=D.map(d=>`<button type="button" class="opt" data-ful="${d.id}" aria-pressed="${d.id===ful}"><i class="r"></i><span>${d[lang]}</span><em>${d.price?"+"+omr(d.price):t("free")}</em></button>`).join("");
  $("#addrWrap").hidden=ful==="pickup";
  $("#sSub").textContent=omr(sub);$("#sDel").textContent=del?omr(del):t("free");$("#sTot").textContent=omr(tot);$("#pay").disabled=!cart.length;
  st.set("ay_cart",cart);st.set("ay_ful",ful);
}
function buildSlots(){const day=$("#day"),time=$("#time"),kd=day.value,kt=time.value;day.innerHTML="";time.innerHTML="";
  for(let i=1;i<=14;i++){const d=new Date();d.setDate(d.getDate()+i);day.add(new Option(i===1?t("tomorrow"):d.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{weekday:"short",day:"numeric",month:"short"}),d.toISOString().slice(0,10)));}
  ["10:00","12:00","14:00","16:00","18:00","19:00","20:00","21:00","22:00"].forEach(s=>{const h=+s.slice(0,2),h12=h>12?h-12:h;time.add(new Option(lang==="ar"?`${h12}:00 ${h<12?"ص":"م"}`:`${h12}:00 ${h<12?"am":"pm"}`,s));});
  if(kd)day.value=kd;if(kt)time.value=kt;}
function openDrawer(v){document.body.classList.toggle("show-drawer",v);$("#drawer").setAttribute("aria-hidden",String(!v));}
function err(k){const m=$("#msg");m.textContent=k?t(k):"";m.classList.toggle("on",!!k);}
let tt;function toast(s){const el=$("#toast");el.textContent="✓ "+s;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1800);}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o)return openModal(o.dataset.open);
  const s=e.target.closest("[data-size]");if(s&&cur){curSize=s.dataset.size;return fillModal();}
  const th=e.target.closest("[data-theme]");if(th&&cur){curTheme=th.dataset.theme;return fillModal();}
  const ad=e.target.closest("[data-add]");if(ad&&cur){const id=ad.dataset.add;curAdds=curAdds.includes(id)?curAdds.filter(x=>x!==id):[...curAdds,id];return fillModal();}
  const f=e.target.closest("[data-ful]");if(f){ful=f.dataset.ful;err("");return renderCart();}
  const i=e.target.closest("[data-inc]");if(i){cart[+i.dataset.inc].qty=Math.min(cart[+i.dataset.inc].qty+1,20);return renderCart();}
  const d=e.target.closest("[data-dec]");if(d){cart[+d.dataset.dec].qty--;return renderCart();}
  const m=e.target.closest("[data-m]");if(m)document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));
});
$("#mInc").onclick=()=>{curQty=Math.min(curQty+1,20);fillModal();};$("#mDec").onclick=()=>{curQty=Math.max(curQty-1,1);fillModal();};
$("#mAdd").onclick=addToCart;$("#mClose").onclick=closeModal;
$("#openCart").onclick=()=>openDrawer(true);$("#dClose").onclick=()=>openDrawer(false);
$("#scrim").onclick=()=>{closeModal();openDrawer(false);};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();openDrawer(false);$("#ps").classList.remove("on");}});
$("#lang").onclick=()=>{ document.body.classList.add('notrans'); setTimeout(()=>document.body.classList.remove('notrans'),60);lang=lang==="en"?"ar":"en";st.set("ay_lang",lang);applyLang();};
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("scrolled",scrollY>8),{passive:true});

$("#pay").onclick=()=>{err("");const name=$("#name").value.trim(),phone=$("#phone").value.trim(),address=$("#address").value.trim();
  if(!cart.length)return err("errEmpty");if(!name||!/^\+?\d[\d\s]{6,16}$/.test(phone))return err("errForm");if(ful!=="pickup"&&!address)return err("errAddr");
  const {tot}=totals();$("#psTot").textContent=omr(tot);$("#psPay").textContent=`${t("psPayBtn")} ${omr(tot)}`;$("#ps").classList.add("on");};
$("#psCancel").onclick=()=>$("#ps").classList.remove("on");
$("#psPay").onclick=()=>{$("#psPay").innerHTML='<span class="spin"></span>';
  setTimeout(()=>{$("#ps").classList.remove("on");const {tot}=totals(),ref="AY-"+Math.floor(1000+Math.random()*9000),dd=D.find(x=>x.id===ful);
    const where=ful==="pickup"?dd[lang]:esc($("#address").value.trim()),when=$("#day").selectedOptions[0].text+" · "+$("#time").selectedOptions[0].text,n=cart.reduce((s,c)=>s+c.qty,0);
    $("#lines").innerHTML=`<div class="done"><div class="tick"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#4E6B53" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
      <div class="rcpt"><div><span>${t("rItems")}</span><span>${n}</span></div><div><span>${t("rHow")}</span><span>${where}</span></div><div><span>${t("rWhen")}</span><span>${esc(when)}</span></div><div><span>${t("rPaid")}</span><span>${omr(tot)}</span></div></div>
      <button type="button" class="btn btn-g" id="again" style="margin-top:20px;width:100%">${t("again")}</button></div>`;
    $("#checkout").hidden=true;$("#dFoot").hidden=true;cart=[];st.set("ay_cart",cart);$("#count").textContent=0;
    $("#again").onclick=()=>{openDrawer(false);$("#dFoot").hidden=false;renderCart();window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(async function init(){
  lang=st.get("ay_lang")||((navigator.language||"").startsWith("ar")?"ar":"en");cart=st.get("ay_cart")||[];ful=st.get("ay_ful")||"hotels";
  try{const c=await(await fetch("catalog.json")).json();P=c.products;D=c.delivery;A=c.addons;TH=c.themes;}catch(e){}
  $("#heroArt").innerHTML=art("setup",{c:["#F0B8C1","#FFFFFF","#C9667A"]});
  applyLang();
  document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
</body>
</html>
