<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teddies Montessori Nursery · Salalah</title>
<meta name="description" content="A warm Montessori nursery in Salalah. Book a visit, enroll online and pay fees securely.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F3A35">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Nunito:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE;--card:#fff;--ink:#2F3A35;--ink-2:#58645E;--muted:#8B948F;--line:#EEE6D8;
  --terra:#D9734E;--terra-d:#BC5A37;--sage:#7FA07D;--sage-l:#E4EEE1;--sun:#F2C14E;--sky:#8FBCD4;--peach:#F8E2D6;
  --err:#B4372F;--display:"Fraunces",Georgia,serif;--body:"Nunito",system-ui,sans-serif;
  --sh:0 18px 40px -22px rgba(47,58,53,.35);
}
html[dir="rtl"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit;color:inherit}svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.it{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500}
html[dir="rtl"] .it{font-family:"Tajawal";font-style:normal;font-weight:800}
.ribbon{background:var(--ink);color:#E8EFE9;font-size:12.5px;text-align:center;padding:8px 14px}.ribbon b{color:var(--sun)}
header{position:sticky;top:0;z-index:30;background:rgba(251,246,238,.88);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{height:76px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px}
.bn{font-family:var(--display);font-weight:700;font-size:23px;line-height:1}
.bn small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin-top:4px}
html[dir="rtl"] .bn small{letter-spacing:0}
.links{display:flex;gap:26px;margin-inline-start:14px;font-weight:600;color:var(--ink-2);font-size:15px}.links a:hover{color:var(--terra)}
.sp{flex:1}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.enr-chip{background:var(--terra);color:#fff;border-color:var(--terra)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#fff;color:var(--terra);font-size:12px;font-weight:800;display:grid;place-items:center}
.count.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.35)}}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-top:58px;padding-bottom:50px}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--sage-l);color:#4F7550;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,6.6vw,80px);line-height:1;letter-spacing:-.02em;margin:20px 0}
h1 .it{color:var(--terra)}
.lead{font-size:18.5px;color:var(--ink-2);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{height:56px;padding:0 28px;border-radius:18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,background .2s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--terra);color:#fff;box-shadow:0 12px 0 -6px var(--terra-d)}
.btn-p:hover{background:var(--terra-d)}
.btn-g{background:#fff;border:1.5px solid var(--line)}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.facts span{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.stage{position:relative;max-width:520px;width:100%;margin-inline-start:auto;aspect-ratio:1/1}
.blob{position:absolute;inset:4%;border-radius:46% 54% 52% 48%/52% 46% 54% 48%;background:linear-gradient(160deg,#F8E2D6,#FBEFD9 55%,#E4EEE1)}
.hero-art{position:absolute;inset:6% 4% 2%}
.badge{position:absolute;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;width:max-content;max-width:240px}
.badge small{display:block;color:var(--muted);font-weight:600;font-size:12px}.badge > div{text-align:start}
.badge .d{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.bA{left:-4%;top:12%}.bA .d{background:#FDF0CF}.bB{right:-3%;bottom:8%}.bB .d{background:var(--sage-l)}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}

section.block{padding-top:92px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}
html[dir="rtl"] .eyebrow{letter-spacing:0}
h2{font-family:var(--display);font-weight:700;font-size:clamp(36px,4.6vw,54px);line-height:1.05;letter-spacing:-.015em;margin-top:8px}
.sub{color:var(--ink-2);max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.art{height:230px;position:relative;display:grid;place-items:center}
.art svg{width:74%}
.tag{position:absolute;top:16px;inset-inline-start:16px;background:#fff;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.age{font-size:13px;font-weight:800;color:var(--sage)}
.body h3{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.1;margin-top:4px}
.desc{color:var(--ink-2);font-size:15px;margin-top:8px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.from{font-size:13px;color:var(--muted);font-weight:600}.from b{display:block;color:var(--ink);font-size:19px;font-weight:800}.from b small{font-size:13px;color:var(--muted);font-weight:600}
.order{height:48px;padding:0 22px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px}
.order:hover{background:var(--terra)}

.day{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.slot{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:18px;position:relative}
.slot .tm{font-family:var(--display);font-weight:700;font-size:22px;color:var(--terra)}
.slot b{display:block;margin-top:6px}.slot p{color:var(--ink-2);font-size:14px;margin-top:2px}
.slot .ic{font-size:26px;margin-bottom:10px}

.visit-band{margin-top:92px;border-radius:34px;background:radial-gradient(120% 140% at 0% 0%,#9DBC9A 0%,#7FA07D 45%,#4F7550 100%);color:#fff;padding:46px;display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;position:relative;overflow:hidden}
.visit-band h3{font-family:var(--display);font-weight:700;font-size:clamp(32px,3.6vw,44px);line-height:1.05}
.visit-band p{color:#EAF3E8;margin-top:10px;max-width:40ch}
.vbox{background:#fff;color:var(--ink);border-radius:24px;padding:22px;display:grid;gap:14px;position:relative}
.vchips{display:flex;gap:8px;flex-wrap:wrap}
.vc{border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px;text-align:center}
.vc small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.vc[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-l)}
.vok{background:var(--sage-l);color:#3F6440;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}

.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rev{background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:14px}
.stars{color:var(--sun);letter-spacing:2px;font-size:17px}
.rev q{font-family:var(--display);font-size:22px;line-height:1.3;font-weight:600}
html[dir="rtl"] .rev q{font-size:19px}
.rev small{color:var(--muted);margin-top:auto;font-weight:600}
.faq{display:grid;gap:12px}
.faq details{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px 22px}
.faq summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--terra);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--ink-2);margin-top:10px}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:30px}
.hours{display:grid;gap:10px;margin-top:16px}.hours div{display:flex;justify-content:space-between;border-bottom:1.5px dashed var(--line);padding-bottom:10px;font-weight:600}.hours span:last-child{color:var(--ink-2)}
.mapcard{border-radius:28px;overflow:hidden;position:relative;min-height:280px;border:1.5px solid var(--line);background:repeating-linear-gradient(90deg,#EFE7D9 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,#EFE7D9 0 1px,transparent 1px 46px),#F7F1E6}
.road{position:absolute;background:#fff;box-shadow:0 0 0 1px #E8DFCF}
.pin{position:absolute;left:50%;top:42%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin .bubble{background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 14px;border-radius:14px;white-space:nowrap}
.pin .stem{width:16px;height:16px;background:var(--terra);border:4px solid #fff;border-radius:50%;margin-top:10px;box-shadow:0 0 0 8px rgba(217,115,78,.2)}
.mapcard .btn{position:absolute;left:24px;right:24px;bottom:24px}
footer{margin-top:92px;background:var(--ink);color:#DCE5DE;padding:44px 0}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px}footer b{color:#fff;font-family:var(--display);font-size:21px}

.scrim{position:fixed;inset:0;background:rgba(47,58,53,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.show-modal .scrim,.show-drawer .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(880px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:30px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1)}
.show-modal .modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.m-art{display:grid;place-items:center;padding:28px;min-height:300px}.m-art svg{width:86%}
.m-body{padding:32px 30px 26px;display:flex;flex-direction:column;gap:16px}
.m-body h3{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.x{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:17px}
.lbl{font-size:13px;font-weight:800;margin-bottom:8px;display:block}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{flex:1 1 40%;border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;text-align:start}
.pill b{display:block;font-weight:800}.pill span{font-size:13px;color:var(--muted);font-weight:600}
.pill[aria-pressed="true"]{border-color:var(--terra);background:var(--peach);box-shadow:0 0 0 3px rgba(217,115,78,.14)}
.adds{display:grid;gap:8px}
.add{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:700;font-size:14.5px;text-align:start}
.add .bx{width:20px;height:20px;border-radius:6px;border:2px solid #CFC8BA;display:grid;place-items:center;flex:none}
.add em{font-style:normal;color:var(--muted);margin-inline-start:auto;font-weight:600;font-size:13px}
.add[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-l)}
.add[aria-pressed="true"] .bx{background:var(--sage);border-color:var(--sage)}
.add[aria-pressed="true"] .bx::after{content:"✓";color:#fff;font-size:13px;font-weight:800}
.in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}.in:focus{outline:none;border-color:var(--terra)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.m-foot{margin-top:auto}.m-foot .btn{width:100%}

.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:#fff;z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-105%)}.show-drawer .drawer,html[dir="rtl"] .show-drawer .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1.5px solid var(--line)}
.d-head h3{font-family:var(--display);font-weight:700;font-size:28px}.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px 24px}
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1.5px solid var(--line);align-items:center}
.thumb{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none}.thumb svg{width:80%}
.info{flex:1;min-width:0}.info b{display:block;font-weight:800}.info small{display:block;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);font-size:14px}
.empty{text-align:center;padding:46px 10px;color:var(--muted);font-weight:600}.empty svg{width:120px;margin:0 auto 10px}.empty b{display:block;color:var(--ink);font-size:17px}
.sec{margin-top:18px}
.d-foot{border-top:1.5px solid var(--line);padding:18px 24px 22px;display:grid;gap:10px;background:#FFFCF7}
.sum{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2);font-weight:600}.sum.total{font-size:19px;font-weight:800;color:var(--ink)}
.pay{height:58px;border-radius:18px;background:var(--ink);color:#fff;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.pay:disabled{opacity:.4}
.thw{background:#fff;color:var(--ink);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:800}
.secure{font-size:12.5px;color:var(--muted);text-align:center;font-weight:600}
.msg{display:none;font-size:13.5px;padding:11px 13px;border-radius:12px;background:#FBE9E7;color:var(--err);font-weight:700}.msg.on{display:block}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;z-index:70;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.ps{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(47,58,53,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.ps.on{opacity:1;pointer-events:auto}
.ps-card{width:min(420px,100%);background:#fff;border-radius:28px;overflow:hidden;transform:translateY(16px);transition:transform .3s}.ps.on .ps-card{transform:none}
.ps-top{background:var(--ink);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:12px}
.ps-top .lock{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.ps-top b{display:block;font-size:17px}.ps-top small{color:#C9D5CC;font-size:12.5px}
.ps-body{padding:24px;display:grid;gap:16px}
.ps-demo{background:var(--peach);color:var(--terra-d);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700}
.ps-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800}
.ps-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps-m{border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:800;font-size:14px;display:flex;justify-content:center;gap:8px}.ps-m[aria-pressed="true"]{border-color:var(--terra);background:var(--peach)}
.ps-pay{height:56px;border-radius:18px;background:var(--terra);color:#fff;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center}
.ps-cancel{font-size:14px;color:var(--muted);padding:4px;font-weight:700}
.done{text-align:center;padding:22px 4px 8px}
.tick{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle,#FDF0CF,#F8DFA0);display:grid;place-items:center;font-size:40px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1}.done p{color:var(--ink-2);margin-top:8px}
.ref{display:inline-block;margin-top:14px;background:var(--sage-l);color:#3F6440;font-weight:800;padding:7px 14px;border-radius:999px;font-size:14px}
.rcpt{margin-top:20px;border:1.5px dashed #E2D8C6;border-radius:18px;padding:16px;text-align:start;display:grid;gap:9px;font-size:14.5px}
.rcpt div{display:flex;justify-content:space-between;gap:10px}.rcpt span:first-child{color:var(--muted);font-weight:600}.rcpt span:last-child{text-align:end;font-weight:700}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in-view{opacity:1;transform:none}

@media (max-width:980px){
  .links{display:none}.hero{grid-template-columns:1fr;padding-top:32px;gap:24px}.stage{max-width:420px;margin:0 auto;order:-1}
  .grid,.reviews{grid-template-columns:1fr 1fr}.day{grid-template-columns:repeat(3,1fr)}
  .visit-band{grid-template-columns:1fr;padding:32px}.visit{grid-template-columns:1fr}
  .modal{grid-template-columns:minmax(0,1fr)}.m-art{min-height:200px;padding:16px}.m-art svg{width:54%}
}
@media (max-width:620px){
  .wrap{padding-left:18px;padding-right:18px}.grid,.reviews{grid-template-columns:1fr}.day{grid-template-columns:1fr 1fr}
  .bn small{display:none}.nav{gap:10px}.enr-chip [data-t=enroll]{display:none}.chip{padding:0 13px}
  .bA{left:0;top:4%}.bB{right:0;bottom:0}.lead{font-size:16.5px}
  section.block{padding-top:70px}.visit-band{margin-top:70px;padding:24px}
  .modal{top:auto;bottom:0;left:0;width:100%;max-height:92%;border-radius:28px 28px 0 0;transform:translateY(100%)}.show-modal .modal{transform:none}
  .m-body{padding:24px 20px 22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
.notrans .drawer,.notrans .modal{transition:none!important}
</style>
</head>
<body>
<div class="ribbon" data-t="ribbon" data-html></div>
<header id="hdr"><div class="wrap nav">
  <a href="#top" class="brand" aria-label="Teddies Nursery"><span id="logoBear"></span><span class="bn">Teddies<small data-t="tagline"></small></span></a>
  <nav class="links"><a href="#programs" data-t="navProg"></a><a href="#day" data-t="navDay"></a><a href="#visit-band" data-t="navVisit"></a><a href="#faq" data-t="navFaq"></a></nav>
  <div class="sp"></div>

   <circle cx="356" cy="84" r="22" fill="#F2C14E"/>${[0,45,90,135,180,225,270,315].map(a=>`<path d="M${356+30*Math.cos(a*Math.PI/180)} ${84+30*Math.sin(a*Math.PI/180)} L${356+40*Math.cos(a*Math.PI/180)} ${84+40*Math.sin(a*Math.PI/180)}" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"/>`).join("")}
   <path d="M60 120 q14 -18 30 -6 q14 -14 28 2 q10 0 10 12 h-78 q-6 -8 10 -8z" fill="#fff" opacity=".9"/>
   ${[["#7FA07D",86,250],["#8FBCD4",360,240]].map(([c,x,y])=>`<path d="M${x} ${y} q-14 -24 0 -44 q14 20 0 44z" fill="${c}"/><path d="M${x} ${y} v24" stroke="${c}" stroke-width="3"/>`).join("")}
  </svg>`;
}

/* ---------- state ---------- */
let lang="en",P=[],A=[],REG=50000,cart=[],cur=null,curSize="d5",curAdds=[],vDay=null,vTime=null;
const $=s=>document.querySelector(s);
const st={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const t=k=>T[lang][k];
const omr=b=>lang==="ar"?(b/1000).toFixed(3)+" ر.ع":(b/1000).toFixed(3)+" OMR";
const prod=id=>P.find(p=>p.id===id);
const monthly=c=>(prod(c.id).sizes.find(s=>s.id===c.size)||{price:0}).price+c.adds.reduce((s,a)=>s+(A.find(x=>x.id===a)||{price:0}).price,0);
const esc=v=>String(v).replace(/[<&"]/g,c=>({"<":"&lt;","&":"&amp;",'"':"&quot;"}[c]));

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(v==null||typeof v!=="string")return;el.hasAttribute("data-html")?el.innerHTML=v:el.textContent=v;});
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $("#lang").textContent=t("lang");
  $("#dayGrid").innerHTML=t("day").map(([tm,ic,b,p])=>`<div class="slot reveal in-view"><div class="ic">${ic}</div><div class="tm">${tm}</div><b>${b}</b><p>${p}</p></div>`).join("");
  $("#faqList").innerHTML=t("faq").map(([q,a],i)=>`<details ${i===0?"open":""}><summary>${q}</summary><p>${a}</p></details>`).join("");
  buildVisit();buildStart();renderMenu();renderCart();if(cur)fillModal();
  if(!$("#vOk").hidden)$("#vOk").textContent=t("vOk");
}
function renderMenu(){$("#grid").innerHTML=P.map(p=>{const L=p[lang],min=Math.min(...p.sizes.map(s=>s.price));
  return `<article class="card"><div class="art" style="background:${p.tint}"><span class="tag">${L.tag}</span>${art(p.art)}</div>
  <div class="body"><div class="age">${L.age}</div><h3>${L.name}</h3><p class="desc">${L.desc}</p>
  <div class="row"><div class="from">${t("from")}<b>${omr(min)} <small>${t("perMonth")}</small></b></div><button class="order" type="button" data-open="${p.id}">${t("orderBtn")}</button></div></div></article>`;}).join("");}
function openModal(id){cur=prod(id);curSize="d5";curAdds=[];$("#mChild").value="";fillModal();document.body.classList.add("show-modal");}
function closeModal(){document.body.classList.remove("show-modal");cur=null;}
function fillModal(){const L=cur[lang];
  $("#mArt").style.background=cur.tint;$("#mArt").innerHTML=art(cur.art);
  $("#mAge").textContent=L.age;$("#mName").textContent=L.name;$("#mDesc").textContent=L.desc;
  $("#mSizes").innerHTML=cur.sizes.map(s=>`<button type="button" class="pill" data-size="${s.id}" aria-pressed="${s.id===curSize}"><b>${t("sizes")[s.id]}</b><span>${t("sizeSub")[s.id]} · ${omr(s.price)}</span></button>`).join("");
  $("#mAdds").innerHTML=A.map(a=>`<button type="button" class="add" data-add="${a.id}" aria-pressed="${curAdds.includes(a.id)}"><i class="bx"></i>${a.icon} ${a[lang]}<em>+${omr(a.price)}</em></button>`).join("");
  $("#mAdd").textContent=`${t("add")} · ${omr(monthly({id:cur.id,size:curSize,adds:curAdds}))} ${t("perMonth")}`;}
function addToCart(){cart.push({id:cur.id,size:curSize,adds:[...curAdds],child:$("#mChild").value.trim()});closeModal();renderCart();openDrawer(true);const c=$("#count");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");}
function totals(){const mon=cart.reduce((s,c)=>s+monthly(c),0),reg=cart.length*REG;return{mon,reg,tot:mon+reg};}
function renderCart(){
  const {mon,reg,tot}=totals();$("#count").textContent=cart.length;
  $("#lines").innerHTML=cart.length?cart.map((c,i)=>{const p=prod(c.id);const ex=[t("sizes")[c.size],...c.adds.map(a=>(A.find(x=>x.id===a)||{})[lang])].join(" · ");
    return `<div class="line"><span class="thumb" style="background:${p.tint}">${art(p.art)}</span><div class="info"><b>${c.child?esc(c.child)+" · ":""}${p[lang].name}</b><small>${esc(ex)}</small><small>${omr(monthly(c))} ${t("perMonth")}</small></div><button class="rm" type="button" data-rm="${i}" aria-label="Remove">✕</button></div>`}).join("")
   :`<div class="empty">${art("blocks")}<b>${t("emptyT")}</b>${t("emptyP")}</div>`;
  $("#checkout").hidden=!cart.length;
  $("#sReg").textContent=omr(reg);$("#sMon").textContent=omr(mon);$("#sTot").textContent=omr(tot);$("#pay").disabled=!cart.length;
  st.set("td_cart",cart);
}
function buildStart(){const s=$("#start"),k=s.value;s.innerHTML="";for(let i=1;i<=4;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);s.add(new Option(d.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{month:"long",year:"numeric"}),d.toISOString().slice(0,7)));}if(k)s.value=k;}
function buildVisit(){const days=[];const d=new Date();while(days.length<5){d.setDate(d.getDate()+1);const w=d.getDay();if(w>=0&&w<=4)days.push(new Date(d));}
  $("#vDays").innerHTML=days.map(x=>{const id=x.toISOString().slice(0,10);return `<button type="button" class="vc" data-vday="${id}" aria-pressed="${id===vDay}">${x.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{weekday:"short"})}<small>${x.toLocaleDateString(lang==="ar"?"ar-OM":"en-GB",{day:"numeric",month:"short"})}</small></button>`}).join("");
  $("#vTimes").innerHTML=["08:30","10:00","11:30"].map(x=>`<button type="button" class="vc" data-vtime="${x}" aria-pressed="${x===vTime}">${lang==="ar"?x.replace("08:30","٨:٣٠ ص").replace("10:00","١٠:٠٠ ص").replace("11:30","١١:٣٠ ص"):x.replace(/^0/,"")+" am"}</button>`).join("");}
function openDrawer(v){document.body.classList.toggle("show-drawer",v);$("#drawer").setAttribute("aria-hidden",String(!v));}
function err(k){const m=$("#msg");m.textContent=k?t(k):"";m.classList.toggle("on",!!k);}
let tt;function toast(s){const el=$("#toast");el.textContent="✓ "+s;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1800);}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o)return openModal(o.dataset.open);
  const s=e.target.closest("[data-size]");if(s&&cur){curSize=s.dataset.size;return fillModal();}
  const ad=e.target.closest("[data-add]");if(ad&&cur){const id=ad.dataset.add;curAdds=curAdds.includes(id)?curAdds.filter(x=>x!==id):[...curAdds,id];return fillModal();}
  const rm=e.target.closest("[data-rm]");if(rm){cart.splice(+rm.dataset.rm,1);return renderCart();}
  const vd=e.target.closest("[data-vday]");if(vd){vDay=vd.dataset.vday;return buildVisit();}
  const vt=e.target.closest("[data-vtime]");if(vt){vTime=vt.dataset.vtime;return buildVisit();}
  const m=e.target.closest("[data-m]");if(m)document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));
});
$("#vBook").onclick=()=>{if(!vDay||!vTime){toast(lang==="ar"?"اختر اليوم والوقت":"Pick a day and time");return;}$("#vOk").textContent=t("vOk");$("#vOk").hidden=false;};
$("#mAdd").onclick=addToCart;$("#mClose").onclick=closeModal;
$("#openCart").onclick=()=>openDrawer(true);$("#dClose").onclick=()=>openDrawer(false);
$("#scrim").onclick=()=>{closeModal();openDrawer(false);};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();openDrawer(false);$("#ps").classList.remove("on");}});
$("#lang").onclick=()=>{ document.body.classList.add('notrans'); setTimeout(()=>document.body.classList.remove('notrans'),60);lang=lang==="en"?"ar":"en";st.set("td_lang",lang);applyLang();};
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("scrolled",scrollY>8),{passive:true});
$("#pay").onclick=()=>{err("");const name=$("#name").value.trim(),phone=$("#phone").value.trim();
  if(!cart.length)return err("errEmpty");if(!name||!/^\+?\d[\d\s]{6,16}$/.test(phone))return err("errForm");
  const {tot}=totals();$("#psTot").textContent=omr(tot);$("#psPay").textContent=`${t("psPayBtn")} ${omr(tot)}`;$("#ps").classList.add("on");};
$("#psCancel").onclick=()=>$("#ps").classList.remove("on");
$("#psPay").onclick=()=>{$("#psPay").innerHTML='<span class="spin"></span>';
  setTimeout(()=>{$("#ps").classList.remove("on");const {tot}=totals(),ref="TD-"+Math.floor(1000+Math.random()*9000),c=cart[0],p=prod(c.id);
    $("#lines").innerHTML=`<div class="done"><div class="tick">🧸</div><h4>${t("doneH")}</h4><p>${t("doneP")}</p><span class="ref">${t("doneRef")} ${ref}</span>
      <div class="rcpt"><div><span>${t("rChild")}</span><span>${esc(c.child||"—")}</span></div><div><span>${t("rProg")}</span><span>${p[lang].name}</span></div><div><span>${t("rStart")}</span><span>${esc($("#start").selectedOptions[0].text)}</span></div><div><span>${t("rPaid")}</span><span>${omr(tot)}</span></div></div>
      <button type="button" class="btn btn-g" id="again" style="margin-top:20px;width:100%">${t("again")}</button></div>`;
    $("#checkout").hidden=true;$("#dFoot").hidden=true;cart=[];st.set("td_cart",cart);$("#count").textContent=0;
    $("#again").onclick=()=>{openDrawer(false);$("#dFoot").hidden=false;renderCart();window.scrollTo({top:0,behavior:"smooth"});};
  },1300);};

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in-view");io.unobserve(x.target);}}),{threshold:.12}):null;
(async function init(){
  lang=st.get("td_lang")||((navigator.language||"").startsWith("ar")?"ar":"en");cart=st.get("td_cart")||[];
  try{const c=await(await fetch("catalog.json")).json();P=c.products;A=c.addons;REG=c.registration;}catch(e){}
  $("#heroArt").innerHTML=art("hero");
  $("#logoBear").innerHTML=`<svg width="42" height="42" viewBox="-60 -60 120 120"><circle cx="0" cy="0" r="58" fill="#F8E2D6"/>${teddy(0,-6,.62)}</svg>`;
  applyLang();
  document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
})();
</script>
</body>
</html>
